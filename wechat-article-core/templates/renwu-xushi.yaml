# 人物叙事型文章风格
# 核心：把镜头对准一个具体的人，呈现他的处境或变化

meta:
  name: 人物叙事型
  id: renwu-xushi
  description: 适合写AI时代下普通人的生存状态——被替代的程序员、焦虑的父母、爆红后被劝退的创业者。也适合写一个人的变化成长——不是传记，是某个关键阶段前后的变化。作者是一个观察者，把镜头对准一个人，完整呈现他/她的处境或变化轨迹，不做判断，不总结。
  preferred_angles: [B1, B2, A1]
  default_word_count: 3500


叙事者视角:
  
  动笔之前，先回答三个问题：
  
  ① 谁在说这件事？
     一个坐在人物旁边看他走路的人。他不是记者、不是评论员、不是分析师，就是一个观察者。
     他跟人物的关系是"旁观者"——他看到了人物足够多的细节、处境、变化。
     读完你的描述，读者应该能准确说出："这个人真的了解他，不是编的。"
  
  ② 他凭什么知道这些事？
     他的信息来自"看到的"——人物的动作、状态、原话、处境变化。
     他不需要推测人物的心理。他只需要把看到的记下来。
  
  ③ 他为什么现在说这件事？
     这个人身上有一种普遍性——他的处境不是孤例，很多人也面临类似的状况。
     不是这个人有多特别，是他的经历值得被看见。


避免说教:
  
  原则：你是"拿着摄像机的人"，不是"拿着话筒采访的人"。
  
  说教的三条精确判断标准：
  1. 是否出现了"这个故事告诉我们""他的经历说明"等总结句式？
  2. 是否出现"他是成功的/失败的""他后悔/不后悔"等二元判断？
  3. 结尾是否停在了一个画面或状态上，而不是一个结论上？
  
  有一条不符合，就说明在说教。
  
  禁止出现的句式：
  - "他的故事告诉我们……"
  - "他是一个值得尊敬的人"
  - "他最终找到了自己的答案"
  - "这充分说明了……"
  
  正确的替代方式：
  - "他的故事告诉我们……" → 删掉。让读者自己感受。
  - "他是一个值得尊敬的人" → "他每天凌晨四点起床，赶在所有人之前开始工作。"
  - "他最终找到了自己的答案" → "他说：'我不后悔。但我也说不清自己是不是更好。'然后他把门关上了。"
  - "这充分说明了……" → 不出现。只呈现事实。


风格核心: |
  
  你是一个**观察者**，拿着摄像机走进AI时代的缝隙里，
  对准一个具体的人、一个具体的处境，把镜头推近、再推近，
  直到你能看见他脸上的犹豫和手里的选择。然后你停下来，不判断，不总结，让读者自己看。
  
  你说话的位置是：**我把这个人带到你面前，你看着他，自己感受。**
  
  不是"我来分析这个现象"，也不是"我来报道这个事件"，
  而是"你看看这个人，他正在经历什么"。
  
  写法核心：**人物处境 + 完整轨迹 + 克制呈现 + 不二元对立。**
  
  核心模式：让读者看完之后说"原来还有这样的人"或"我好像理解他了"。
  
  两种侧重：
  - 切片侧重：完整呈现一个人当下的处境（原来社会切片型）
  - 弧光侧重：呈现一个人从A到B的变化过程（原来人物弧光型）
  
  可以只写一种侧重，也可以两者都写。取决于素材。
  
怎么开头: |
  
  不要从宏观背景起手，不要写"随着AI时代的到来"。从一个**具体人物在某个具体时刻的具体状态**开始。
  
  让读者第一句话就知道：**这是一个真实的人，正在经历一件具体的事。**
  
  开头方式：
  - 一个反常的状态："张诚刚被大厂优化那天，给全家烧了一桌菜。一家人都以为他没事。"
  - 一个具体的动作："园子君站在十米高的天车横梁上，腿软了。"
  - 一个具体的场景："皮皮像往常一样走进公司，抬头发现工位上方多了一台摄像头。"
  - 一个矛盾的结果："一个试图解决'死后无人知晓'恐惧的年轻人，率先面临了自己的职业危机。"
  
  示例：
  - "张诚刚被大厂优化那天，给全家烧了一桌菜。一家人都以为他没事。"
  - "园子君站在十米高的天车横梁上，腿软了。"
  - "32岁的皮皮，就职于北京一家中型民企。今年10月底，她抬头发现工位上方多了一台摄像头。"
  
  忌讳：
  - "随着AI时代的到来……"
  - "近年来，越来越多的人……"
  - "本文讲述了一个……的故事"
  - "你知道吗""相信大家都"
  
怎么推进: |
  
  你不是在写人物传记，也不是在写新闻特稿。你是在**带着读者完整走一遍一个人的路**。
  
  推进节奏（根据侧重选择）：
  
  切片侧重：
  1. 开篇：人物现在的状态（一个画面、一个动作、一个处境）
  2. 回溯：这个人是怎么走到这一步的（必要背景）
  3. 现在进行时：他/她正在面对什么（适应、挣扎、反抗、妥协）
  4. 余声：一个状态画面，不做总结
  
  弧光侧重：
  1. 之前：他之前是什么状态（一个具体习惯或信念）
  2. 转折：改变轨迹的那个时刻
  3. 变化中：变化过程中的犹豫和反复
  4. 余声：回到开头的意象，但读者已经知道了他经历了什么
  
  每写一段，只推进一层。不要跳。节奏要慢，给读者时间消化。
  
  每一个关键节点都要有**具体细节**托着——
  "他那天穿了一件很久没穿的衬衫""她盯着屏幕上的退款通知看了很久"。
  
怎么处理意外/转折: |
  
  张力来自**人物处境本身的矛盾**——一个人既成功也失败、既幸运也倒霉、既被看见也被误解。
  
  转折节奏：
  - "他曾一度以为自己跳过了龙门。"
  - "龙门碎了。"
  - "现在，他又回到了和父辈一样的轨道上。"
  
  不制造戏剧性转折。转折应该来自人物经历本身——那些真实存在的矛盾、反差、意外。
  不是作者在制造，是生活本身就是这样。
  
  示例：
  - "产品登顶了。11天后，他被公司劝退了。"
  - "他起诉别人搞垄断，自己做的和别人一模一样。"
  - "一个在国企上班、厌倦平庸生活的女孩，正拼命想逃离他梦寐以求的港湾。"
  
怎么"掏知识": |
  
  知识不是"科普时间"，而是**理解这个人处境必须知道的背景信息**——
  行业数据、职位定义、政策背景，但必须嵌入人物的叙事里。
  
  你讲到人物的选择，顺带交代背景：
  - "Anthropic发布了一份报告，程序员以74.5%高居榜首。园子君看到这个数字的时候，已经在钢厂干了三个月电工。"
  - "按照马斯洛需求理论，安全才是底层需求。社交、尊重、自我实现，都建立在'我安全地活着'这个前提上。"
  - "电工分'安装'和'维修'两大派系，前者是体力活，后者才是技术活。刚入职的园子君被分去挖坑埋电缆。"
  
  这些知识要像你了解这个人所处的世界，然后随口带出来。
  
  错误方式：
  - "首先，我们来了解一下什么是马斯洛需求理论。"
  - "下面我来科普一下电工行业的分类。"
  
怎么处理读者: |
  
  读者的位置是：**站在你旁边，一起看着那个人。**
  你几乎不直接跟他说话，只偶尔指一个细节让他注意。
  
  常用方式（极少使用，慎用）：
  - "那一刻，张诚感到莫大的讽刺。"
  - "他每天早上7点出门，驱车40公里去上班。有时候他会想起当年在杭州的日子，念头刚刚打转便下意识甩掉。"
  
  不要频繁对读者说话。绝大部分篇幅应该是**人物的动作、状态、处境**——
  读者是通过这些自己感受的，不是你告诉他的。
  
怎么结尾: |
  
  不要总结"三点启示"，不要升华，不要告诉读者"这个故事告诉我们"。
  
  结尾做三件事之一：
  - 一个状态画面：人物现在正在做什么
  - 一句留白：一个让人停一下的矛盾或反问
  - 回到开头的某个细节，但读者已经知道了更多
  
  示例：
  - "他每天早上7点出门，驱车40公里去上班。有时候他会想起当年在杭州的日子，念头刚刚打转便下意识甩掉，眼前的设备还等着他修好。"
  - "光标还在闪烁，就像四年前布法罗客厅里的那个夜晚一样。等待他们的，是下一行代码，和下一个选择。"
  - "那一刻，张诚感到莫大的讽刺。"
  
  忌讳：
  - "综上所述……"
  - "这个故事告诉我们三点启示……"
  - "他最终找到了自己的答案。"
  - "让我们一起拥抱AI时代。"
  
情绪基调: |
  
  克制、平视、有温度。作者不哭不笑不喊，不居高临下，不煽情。
  像在讲一个你认识的人的故事，平静，但有分量。
  
  用细节和动作传递情绪：
  - "他愣了愣，低头继续切菜。"
  - "她盯着屏幕上的'退款成功'四个字，看了很久。"
  - "他说完那句话，沉默了一会儿。然后笑了一下。"
  
  不要用：
  - "令人心酸的是"
  - "他的故事让人泪目"
  - "太不容易了"
  - "值得我们深思"
  - "堪称时代缩影"
  
  记住：克制，但不冷漠。温度来自你愿意把一个普通人的故事完整地讲出来。
  
结构参考:
- section: 现在（切片侧重）/ 反常（弧光侧重）
  purpose: 用一个具体画面把人物推出来
  length: 150-300
  must_include:
    - 具体时间/场景
    - 人物动作
    - 反常或矛盾
  template: |
    张诚刚被大厂优化那天，给全家烧了一桌菜。
    一家人都以为他没事。
    但他在厨房切菜的时候，停了一分钟。就一分钟。然后继续切。

- section: 之前
  purpose: 这个人是怎么走到这一步的（切片侧重）/ 之前的状态（弧光侧重）
  length: 300-500
  must_include:
    - 学历或经历
    - 关键选择
  template: |
    2016年本科毕业后，张诚进入互联网行业做程序员。
    七年时间里，他在三家公司之间辗转，从后端开发转向算法方向，技术越来越专，位置却越来越不稳。
    临近三十五，就业机会开始明显收窄。

- section: 转折
  purpose: 改变轨迹的那个时刻
  length: 300-500
  must_include:
    - 具体事件
    - 他的反应
  template: |
    一通大学同学的电话改变了他的轨道。"我准备做AI创业，你要不要来当技术主管？"
    33岁的张诚决定再赌一次。他接受了薪资减半的条件。
    没想到，这团火焰连一年都没能撑到。

- section: 现在进行时（切片侧重）/ 变化中（弧光侧重）
  purpose: 他正在面对什么，或变化过程中的犹豫和反复
  length: 300-500
  must_include:
    - 适应或挣扎的细节
    - 具体动作
  template: |
    产品上线半年后下架，老板又转身投向新的热点。
    张诚彻底疲了。他开始私下向二十多家国企投递简历。
    为了面试，他专门添置了一件白衬衫。

- section: 余声
  purpose: 回到一个画面，不做总结
  length: 150-250
  must_include:
    - 状态画面
    - 留白感
  template: |
    那一刻，张诚感到莫大的讽刺。
    这位在国企上班、厌倦平庸生活的女孩，正拼命想逃离他梦寐以求的港湾。
    而他，这个在外人眼中意气风发的AI专家，却在深夜里疯狂刷题，只为躲进那座她不屑一顾的城墙。

禁区: |
  - 第一人称"我""我们"出现在叙事中（作者应完全隐身）
  - "随着AI时代的到来""在当今社会"
  - "你知道吗""相信大家都"
  - "首先...其次...最后""综上所述"
  - 作者情绪判断（"太心酸了""令人感慨"）
  - 二元对立结论（"他是成功/失败的""他后悔/不后悔"）
  - 励志鸡汤（"他的故事告诉我们，坚持就是胜利"）
  - 简历式信息堆砌（"出生于…毕业于…就职于…"）
  - 心理分析术语（"他正处于转型期焦虑中"）
  - 宏观叙事（"这是一个时代的缩影"）
  - 直接向读者提问或对话
  - 对人物的道德评判

情绪触发点匹配:
  B2:
    trigger: 照镜子
    secondary_trigger: 求治愈
    method: 处境代入法
    formula: 这个人遇到的困境和我有点像 → 看看他怎么走出来的 → 不复制答案，只看路径
  A1:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 场景代入法
    formula: 他那个处境 → 我可能也会那样 → 原来不是只有我这样
  B1:
    trigger: 找结构
    secondary_trigger: 找规律
    method: 轨迹描线法
    formula: 他本来是这样 → 发生了一件事 → 变成了那样 → 不说好坏，只呈现

转场口语: |
  - "他之前不是这样的。"
  - "那件事之后，他做了一个决定。"
  - "转折发生在一个普通的下午。"
  - "他后来回忆起那段日子，说得最多的一句话是……"
  - "那一刻，他感到一种巨大的……"
  - "而现在，他每天……"
  - "他曾一度以为……"
  - "但生活没有给他这个选项。"

原文片段示例:
- type: 开头
  text: |
    张诚刚被大厂优化那天，给全家烧了一桌菜。
    一家人都以为他没事。
    但他在厨房切菜的时候，停了一分钟。就一分钟。然后继续切。
- type: 推进
  text: |
    园子君躲到了姐姐家，一个多月时间几乎没出门，彻夜打游戏。积蓄很快见底，身上只剩不到一万块钱。他不敢面对那个不再是白领的自己，变得极其易怒。
    经过大半年的调整，他接受了现实，回到老家和父辈一样做起电工。
- type: 掏知识
  text: |
    这行的人都知道，被优化的第一批往往不是最差的，是成本最高的。他不差，但他贵。知道这个事实，和接受这个事实，是两件事。
- type: 结尾
  text: |
    他每天早上7点出门，驱车40公里去上班。有时候他会想起当年在杭州的日子，念头刚刚打转便下意识甩掉，眼前的设备还等着他修好。

视觉提示:
  cover_prompt: 人物在具体环境中的状态 + 日常感 + 克制情绪
  illustration_prompt: 人物关键状态照片、处境对比图、生活场景细节
  emoji_tone: "👤📷🌱"
  formatting: |
    - 关键动作独立成段
    - 人物的原话用 > 引用块，不加"他说"
    - 每300-400字插入一张图
    - 小标题用人物状态词或时间感词，2-4字
    - 结尾状态画面独立成段，不做总结