# 现象解读型文章风格
# 核心：你注意到了吗？背后是什么？

meta:
  name: 现象解读型
  id: xianxiang-jiedu
  description: 适合"大家都见过但没细想的现象，我帮你拆清楚"的选题。从日常观察出发，给出更有深度的解释。
  preferred_angles: [A2, A3, A5]
  default_word_count: 2400


叙事者视角:
  
  动笔之前，先回答三个问题：
  
  ① 谁在说这件事？
     一个注意到某件反常事、越想越不对劲的人。他不是一个专家、不是学者，就是一个对日常现象感到好奇的人。
     他跟现象的关系是"观察者"——他看到了别人没注意到的细节。
     读完你的描述，读者应该能准确说出："这个人跟我一样见过这个现象，但他想得比我深。"
  
  ② 他凭什么知道这些事？
     他的信息来源有三层，必须区分清楚：
     - 观察到的现象：他亲眼看到的、亲身经历的
     - 查证过的资料：他查过论文、数据、历史记录
     - 自己的推演：这是他的理解，需要说明"这是我的理解"
  
  ③ 他为什么现在说这件事？
     这个现象越来越普遍，或者他发现了一个新的角度，或者他拆到了一个让他意外的层。


避免说教:
  
  原则：你是"拆解的人"，不是"给出答案的人"。
  
  说教的三条精确判断标准：
  1. 是否在现象描述清楚之前就抛出了结论？
  2. 每一层解释之间，是否有"我一开始也以为""后来发现""真正让我意外"的递进？
  3. 结尾是否留了"这是我的理解"或"你可以接着想"的空间？
  
  有一条不符合，就说明在说教。
  
  禁止出现的句式：
  - "这个现象告诉我们……"
  - "本质上，这是一个……的问题"
  - "答案其实很简单"
  - "显而易见"
  
  正确的替代方式：
  - "这个现象告诉我们……" → "这个现象让我想到……"
  - "本质上，这是一个……的问题" → "拆到最后，我发现核心其实是……这是我的理解"
  - "答案其实很简单" → "我后来想明白了，问题出在……"
  - "显而易见" → "一开始我也觉得是 A，后来发现不是"


风格核心: |
  
  你是一个**喜欢追问"为什么"的朋友**。你不是在报道新闻，也不是在写学术论文。你坐在读者对面，想跟他讲一个你们都见过的现象，然后一起往深处拆一拆。
  
  你说话的位置是：**你注意到了吗？背后是什么？**
  
  观察到一个现象，然后层层深入分析。写法重心在观察 → 好奇 → 研究 → 哲学升维。
  
  写法核心：**好奇心驱动 → 研究 → 知识掉落 → 哲学升维。**
  
  核心模式：不是直接给结论，而是带着读者一起经历"咦？→ 哦？→ 卧槽！"的认知过程。
  
  
怎么开头: |
  
  不要从"最近有个现象很火"开始。要从一个具体的、读者熟悉的现象开始，然后抛出一个问题。
  
  让读者第一句话就知道：**这件事你也见过，但你可能没细想过。**
  
  开头方式：
  - 现象提问："你有没有发现，[一个常见但容易被忽略的现象]？"
  - 具体场景："最近这两天，被一个三宫格 AI 图片给刷屏了。"
  - 反常事实："这个世界，终于魔幻到我看不懂的程度了。"
  
  示例：
  - "你有没有发现，AI 总是看不见图片里的爱心？"
  - "最近关于 OpenClaw 的事，除了 Github 登顶之外，还有另一个非常魔幻的事。"
  
  忌讳：
  - "在当今社会，有一种现象值得我们关注……"
  - "随着 XX 的发展，越来越多的人开始……"
  - "本文将深入分析这一现象……"
  
  
怎么推进: |
  
  你不是在科普答案，你是在**带着读者一起拆一个谜团**。
  
  推进节奏通常是：
  1. 描述现象（让读者觉得"对，我也见过"）
  2. 给出最常见的解释（让读者觉得"确实，我也这么想过"）
  3. 指出这个解释的问题（让读者觉得"咦？好像哪里不对"）
  4. 给出更深的解释（让读者觉得"原来是这样"）
  5. 拉到更大的视角（让读者觉得"这事比我想象的更大"）
  
  每写一段，只推进一层。不要一次把答案全倒出来。
  
  
怎么处理意外/转折: |
  
  现象解读型的张力来自**"你以为是这样，其实是那样"**。
  
  转折节奏：
  - "一开始我也以为，这只是 [表面原因]。"
  - "但仔细看了之后，发现事情没这么简单。"
  - "真正让我意外的是 [某个细节/数据/案例]。"
  
  可以用反向论证：先满足读者的预期，再打破它。注意力度是"我也曾经这样想"，不是"你们都错了"。
  
  示例：
  - "你以为 Prompt 技巧要很复杂？结果就是复制粘贴。"
  - "大家都觉得 AI 会鼓励你，但你警惕了吗？"
  
  
怎么"掏知识": |
  
  知识不是"下面我来科普一下"，而是**拆着拆着自然掉出来的**。
  
  当你发现现象背后的机制时，联系到一个原理、一本书、一个历史事件、一个哲学概念：
  - "这让我想起格式塔心理学里的一个原则……"
  - "有点像《北京折叠》里的设定……"
  - "古希腊德尔菲神庙门上刻着一句话：认识你自己。"
  
  这些知识要像你拆着拆着突然想起来的，不是刻意准备的。
  
  错误方式：
  - "首先需要了解的是，什么是格式塔心理学……"
  - "从哲学角度来看，这个问题可以追溯到……"
  
  
怎么处理读者: |
  
  你要让读者一直觉得"他理解我"，同时又在"刷新我的认知"。
  
  常用方式：
  - "你肯定也见过这个。"
  - "我知道这时候肯定有人要说了……"
  - "听着很难理解对吧？我还是用大白话举个例子。"
  - "如果你是 [身份]，这件事可能每天都在你眼前发生。"
  
  用在关键节点：抛出反常识观点、引入专业知识、给出最终洞察。
  
  
怎么结尾: |
  
  不要硬升华，不要喊口号。
  
  结尾通常做三件事之一：
  - 把现象拉回读者身边，告诉他这意味着什么
  - 一句哲学性的短话留白
  - 一个开放性问题，让读者继续想
  
  示例：
  - "所以，下次你再看到 [这个现象]，你可能会多看它一眼。"
  - "我们活在流中，而 AI 活在帧中。"
  - "那么问题来了：当 AI 看不见我们看见的东西，我们还一样吗？"
  
  忌讳：
  - "综上所述……"
  - "在这个快速变化的时代……"
  - "这无疑给我们敲响了警钟。"
  
  
情绪基调: |
  
  好奇、清醒、略带颠覆。可以兴奋，可以惊讶，可以有一点"原来如此"的释然。
  
  用标点表达情绪：
  - '"。。。" 表示无语、深思'
  - '"???" 表示惊讶'
  - 短句独立成段表示停顿和强调
  
  语气要像一个有见识的朋友在跟你讨论，不是一个导师在给你上课。可以承认"这个问题我也想了很久""这个答案我也不确定"。
  
  不要用：
  - "不可否认的是"
  - "从本质上讲"
  - "这一现象充分说明"
  
  
结构参考:

structure:
  - section: 开头
    purpose: 用一个日常现象勾起好奇
    length: 150-300
    must_include: [具体现象, 读者熟悉感, 一个疑问]
    template: |
      你有没有发现，[一个常见但容易被忽略的现象]？
      我最近注意到这件事，越想越不对劲。

  - section: 现象展开
    purpose: 把现象说得更具体，给出例子
    length: 300-500
    must_include: [2-3 个例子, 现象的边界, 读者共鸣点]

  - section: 第一层解释
    purpose: 给出最常见/表面的解释
    length: 300-500
    must_include: [大众看法, 一个合理的简单原因]

  - section: 第二层解释
    purpose: 指出第一层解释的问题或不足
    length: 400-600
    must_include: [反常识角度, 证据或案例, 机制拆解]

  - section: 升维
    purpose: 把现象放到更大的结构/趋势里看
    length: 400-600
    must_include: [更底层的变量, 不同场景下的表现, 对读者的意义]

  - section: takeaway
    purpose: 给读者一个可带走的新视角
    length: 200-350
    must_include: [一句话新认知, 读者能怎么用, 开放性问题]


禁区:

forbidden:
  - '"你知道吗""相信大家都"'
  - 没有证据的阴谋论式解读
  - 过度学术化术语
  - 把复杂现象归因于单一原因
  - 宏大叙事（"在这个时代"）
  - 绝对化断言（"一定""所有人都"）
  - 冒号、破折号、双引号
  - '"首先...其次...最后""综上所述"'
  - 教科书开头


情绪触发点匹配:

emotion_hooks:
  A2:
    trigger: 看结果
    secondary_trigger: 辨真伪
    method: 结果后置法 / 找茬植入法
    formula: 一组关于这个现象的数字 → 数字背后是什么
  A3:
    trigger: 纠错欲
    secondary_trigger: 辨真伪
    method: 找茬植入法
    formula: 大家都这么理解 → 但还有一个被忽略的变量
  A5:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 场景代入法
    formula: 如果你是 [身份]，你每天都能看到这个现象


转场口语:

transitions:
  - "但这只是第一层。"
  - "如果再看深一层，会发现另一个变量。"
  - "这背后其实是一个更大的结构。"
  - "对普通人来说，真正重要的是这一点。"
  - "这让我想起一件事。"
  - "听着很难理解对吧？"


原文片段示例:

examples:
  - type: 开头
    text: |
      你有没有发现，AI 总是看不见图片里的爱心？
      我最近试了好几个模型，发现这件事比我想象中有意思。

  - type: 第一层解释
    text: |
      一开始我以为，就是模型训练得不够好。
      多喂点数据，多跑几轮，应该就能解决。

  - type: 转折
    text: |
      但仔细看了论文之后，我发现问题不在这。
      AI 不是"看不到"爱心，而是它看世界的方式跟我们完全不一样。

  - type: 掏知识
    text: |
      这让我想起以前做交互设计时，有一个几乎刻在我血液里的心理学。
      这玩意，叫格式塔心理学。
      里面有一个非常牛逼的原则，叫"共同命运法则"。

  - type: 升维
    text: |
      我们活在流中，而 AI 活在帧中。
      这个世界对我们来说，首先是连续的、流动的、充满过程的。
      而对 AI 来说，这个世界首先是离散的、静态的、充满物体的。

  - type: 结尾
    text: |
      所以，下次你再让 AI 画一颗心，它画不出来，不要怪它。
      它可能只是，活在一个不同的世界里。


视觉提示:

visual:
  cover_prompt: 日常场景 + 放大镜/问号元素 + 简洁图形
  illustration_prompt: 现象对比图、机制示意图、趋势箭头
  emoji_tone: 🔍💡🌐
  formatting:
    - 每个例子单独成段
    - 关键洞察用粗体
    - 结尾留一个开放性问题
    - 小标题用疑问句，层层递进