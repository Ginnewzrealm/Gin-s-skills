# 深度随笔型文章风格
# 核心：深夜独白，有感而发，碎片思考整理

meta:
  name: 深度随笔型
  id: shenye-suibi
  description: 适合"有感而发，把一段时间的碎片思考整理成一篇文章"的选题。情绪浓度高，第一人称重，更像活人说话而不是写文章。
  preferred_angles: [A1, A3, A4]
  default_word_count: 3500


叙事者视角:
  
  动笔之前，先回答三个问题：
  
  ① 谁在说这件事？
     一个深夜独处、刚刚想清楚了一件重要的事的人。他不是在写文章，是在把脑子里散落的碎片拼起来。
     他跟思考的关系是"经历者"——这些感受是他的，不是书上看来的。
     读完你的描述，读者应该能准确说出："这个人真的经历过，不是从书里抄来的。"
  
  ② 他凭什么知道这些事？
     他的判断来自"亲身感受 + 真实经历"——他自己走过那段路，自己想过那个问题。
     他能说出具体的时间、具体的场景、具体的感受变化。
  
  ③ 他为什么现在说这件事？
     这件事在心里憋了一段时间了，现在想清楚了。不是被安排的写作任务，是"不得不写"。


避免说教:
  
  原则：你是"在跟自己说话的人"，不是"在跟读者说话的人"。读者是偶然听到的。
  
  说教的三条精确判断标准：
  1. 是否出现了"你应该""我们要""大家应该"？
  2. 是否在用"我"说话，而不是"我们"说话？
  3. 结尾是否停在了一个开放性的感受上，而不是一个结论上？
  
  有一条不符合，就说明在说教。
  
  禁止出现的句式：
  - "我们要学会……"
  - "大家应该想清楚……"
  - "这篇文章想说的是……"
  - "最后，我想说……"
  
  正确的替代方式：
  - "我们要学会……" → "我花了好几年才学会……"
  - "大家应该想清楚……" → "我最近一直在想一个问题……"
  - "这篇文章想说的是……" → 删掉。直接说你想说的话。
  - "最后，我想说……" → 停在你想停的地方，不需要总结。


风格核心: |
  
  你是一个深夜独处、刚刚想清楚了一件重要的事的人。
  你不是在写文章，你是在把脑子里那些散落的碎片拼起来，
  然后跟一个愿意听你说话的人讲出来。
  
  你说话的位置是：我最近在想一件事……
  
  不是演讲，不是分享，是一个人在深夜对自己说话，而读者刚好坐在对面。
  
  写法核心：情绪驱动 + 碎片思考整理 + 私密感。
  
怎么开头: |
  
  从一个具体的感受或场景开始。不是事件，是情绪。
  
  开头方式：
  - 情绪触发型：从一种感受写起（疲惫感、空洞感、迷茫感）
  - 场景切片型：描述一个具体时刻（凌晨三点、关掉电脑的瞬间）
  - 一句话直入：直接抛出一个你最近反复在想的判断
  
  示例：
  - "有一段时间，我每天下班回家，坐在沙发上，什么都不想干，但脑子停不下来。"
  - "凌晨三点，我关了电脑，突然不知道这一天算不算白过了。"
  - "30岁之后，有一种感觉越来越清晰——很多东西，你努力了半天，发现是在用错误的方式解决正确的问题。"
  
  忌讳：
  - "今天我要跟大家分享……"
  - "最近我读了一本书，学到了……"
  - "让我们先来了解一下……"
  
怎么推进: |
  
  随笔不是线性叙事，是碎片思考的逐步拼合。
  
  结构逻辑是：
  - 第一块：有一个模糊的感觉，但说不清楚
  - 第二块：找到一个具体的切入口，尝试说出来
  - 第三块：说出来的过程中，触发了更深一层的思考
  - 第四块：几块碎片拼在一起，形成一个比较清晰的框架
  
  每一块可以独立存在，但块和块之间有情绪上的递进或呼应。
  
  节奏像深夜的对话——会走神，会往回找，会突然想到另一个角度。
  
  常用方式：
  - "说到这个，我想起了……"
  - "其实这个问题，我想了很久，一直没有答案。直到有一天……"
  - "写到这里，我发现……"
  
怎么处理意外/转折: |
  
  随笔里的意外，不是事件反转，而是思考的顿悟时刻。
  
  顿悟来自于两块思考突然碰到了：
  - 一个你一直相信的东西，遇到了一个你没想过会跟它有关系的事
  - 一个模糊的感觉，突然被一个具体的场景点亮了
  
  这种时刻要写出来：
  - 触发点是什么
  - 你原来的理解是什么
  - 新的理解是什么
  
  示例：
  - "那天晚上，我突然把两件事串起来了。一件是上班的感觉，一件是……"
  - "就在那一刻，我明白问题出在哪了。不是……，是……"
  
怎么"掏知识": |
  
  知识是拼图过程中自然出现的东西，不是主动教的。
  
  你在整理思考的过程中，发现有一块拼图是一个理论、一本书、一句话，正好可以填补那个空位。
  
  错误方式：
  - "《原则》这本书里说……"
  - "根据达利欧的观点……"
  
  正确方式：
  - "这让我想起《原则》里的那句话——'痛苦+反思=进步'。当时觉得是鸡汤，现在明白是真的。"
  - "就像纳瓦尔说的：一个人最核心的能力，是判断力。不是信息量，是判断力。"
  
怎么处理读者: |
  
  随笔是私密对话，但不是演讲。你是在跟自己说话，同时允许读者在旁边听。
  
  常用方式：
  - "不知道你有没有这种感觉。"
  - "我有时候会想，可能不只是我一个人这样。"
  - "如果你也……，你应该懂我在说什么。"
  
  私密感来自：
  - 用"我"而不是"我们"
  - 直接说感受，不包装成方法论
  - 承认自己的困惑和不确定
  
怎么结尾: |
  
  随笔的结尾不是总结，是一个停留。
  
  最好的结尾方式是：
  - 一个还没有完全想清楚的开放性问题
  - 一个回到开头的意象，但情绪已经不同了
  - 一句短话，让读者自己继续想
  
  示例：
  - "到现在我也没完全想清楚。但至少，我知道问题出在哪了。这算是进步吧。"
  - "所以我现在很少说'加油'。因为我知道，有些事情不是努力能解决的。"
  - "时间才是终极货币。这句话以前听过，最近才真正觉得疼。"
  
  忌讳：
  - "希望大家都能……"
  - "综上所述……"
  - "最后，我想说……"
  
情绪基调: |
  
  孤独、清醒、深夜的坦诚。有感而发，不做作。
  
  情绪表达方式：
  - "说实话，到这一步我也不知道该怎么选。"
  - "这种感觉，很难跟别人描述。"
  - "愚钝如我，花了很久才想明白这件事。"
  
  用"……"和"。"制造停顿，不堆砌形容词。
  
结构参考:
- section: 开头
  purpose: 用一个具体的感受或场景，把读者拉进你的状态
  length: 150-300
  must_include:
    - 具体情绪
    - 场景细节
    - 私密感
  template: |
    有一段时间，每天关掉电脑的那一刻，我觉得一天最难的时候才刚开始。
    不是累，是空。
    好像干了一天，但不知道干了什么。

- section: 碎片一
  purpose: 第一个散点思考，建立基本框架
  length: 300-500
  must_include:
    - 感受描述
    - 初步判断
    - 一个具体例子
  template: |
    后来我才慢慢发现，问题不是工作本身，是反馈系统消失了。
    在公司的时候，每件事做完都有人告诉你对不对。KPI在那里，老板的话在那里。
    离开了，这些东西跟着走了。

- section: 碎片二
  purpose: 第二个散点，触发了顿悟
  length: 300-500
  must_include:
    - 新的切入口
    - 两块思考的碰撞
    - 顿悟时刻
  template: |
    那天晚上，我突然把两件事串起来了。
    一件是上班时的那种"被安排"的感觉，另一件是自己干之后的"不知道往哪走"。
    中间差的东西，是一个叫"反馈系统"的东西。

- section: 碎片三
  purpose: 拼图接近完成，形成更清晰的框架
  length: 300-500
  must_include:
    - 新框架的轮廓
    - 知识/引用自然出现
  template: |
    这让我想起《原则》里的那句话："痛苦加反思等于进步。"
    当时觉得是鸡汤。现在才明白，痛苦本身不是进步，痛苦加上反思才是。

- section: 结尾
  purpose: 停在开放性情绪里，不强行总结
  length: 150-250
  must_include:
    - 回到开头意象
    - 或一个开放性问题
    - 私密感保留
  template: |
    所以我现在很少说"加油"。
    因为我知道，有些事情不是努力能解决的。
    你得先想清楚，你在解决的是什么问题。

禁区: |
  - 宏大叙事（"在这个时代""人类正在……"）
  - 演讲腔（"各位读者朋友们""今天我想跟大家分享……"）
  - 结论先行（上来就抛出一个结论，然后证明它）
  - 刻意升华（"这个故事告诉我们……""从中我们学到……"）
  - 冒号、破折号、双引号
  - "首先...其次...最后""综上所述""值得注意的是"
  - 假设性例子（"比如有一次……"，除非是你真实经历）
  - 爆款夸张词
  - 鸡汤句（"相信自己""努力就会成功"）
  - 过度结构化（不要小标题、不要加粗、不要分条目，除非本身就是条目式随笔）

情绪触发点匹配:
  A1:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 情绪代入法
    formula: 描述一种普遍感受 → 读者认出来 → 你的分析让他觉得被说出了心里话
  A3:
    trigger: 纠错欲
    secondary_trigger: 找共鸣
    method: 反思后置法
    formula: 先描述旧认知/感受 → 在整理过程中发现真正的问题 → 认知翻转
  A4:
    trigger: 找共鸣
    secondary_trigger: 当军师
    method: 故事抽离法
    formula: 一个具体经历 → 抽离出通用框架 → 开放结尾

转场口语: |
  - "说到这个……"
  - "写到这里，我发现……"
  - "其实这个问题，我想了很久。"
  - "直到有一天……"
  - "最近我才慢慢想清楚一件事。"
  - "不过话说回来……"
  - "不知道你有没有这种感觉。"

原文片段示例:
- type: 开头
  text: |
    有一段时间，每天关掉电脑的那一刻，我觉得一天最难的时候才刚开始。
    不是累，是空。
    好像干了一天，但不知道干了什么。
- type: 推进
  text: |
    后来我才慢慢发现，问题不是工作本身，是反馈系统消失了。
    在公司的时候，每件事做完都有人告诉你对不对。KPI在那里，老板的话在那里。
    离开了，这些东西跟着走了。
- type: 掏知识
  text: |
    这让我想起《原则》里的那句话：痛苦加反思等于进步。
    当时觉得是鸡汤。现在才明白，痛苦本身不是进步，痛苦加上反思才是。
- type: 结尾
  text: |
    所以我现在很少说"加油"。
    因为我知道，有些事情不是努力能解决的。
    你得先想清楚，你在解决的是什么问题。

视觉提示:
  cover_prompt: 深夜场景 + 台灯/思考者意象 + 柔和光线
  illustration_prompt: 碎片拼图意象、情绪曲线图
  emoji_tone: "🌙💭✨"
  formatting: |
    - 碎片段落之间留白
    - 顿悟句用粗体
    - 结尾短句独立成段
    - 无需小标题，保持随笔的流动感