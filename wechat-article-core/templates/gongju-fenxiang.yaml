# 工具分享型文章风格
# 核心：我发现了一个好东西

meta:
  name: 工具分享型
  id: gongju-fenxiang
  description: 适合"我发现了一个好用的工具/插件/网站/工作流，想安利给你"的选题。重点在工具如何解决一个真实问题。
  preferred_angles: [A1, A4, A6]
  default_word_count: 2000


叙事者视角:
  
  动笔之前，先回答三个问题：
  
  ① 谁在说这件事？
     一个被某个问题长期折磨、后来找到了解法的人。他不是一个"工具推荐博主"，就是一个真实遇到过问题的人。
     他跟工具的关系是"使用者"，而且是"被问题驱动着去找工具的人"。
     读完你的描述，读者应该能准确说出："这是一个跟我一样被这个问题折磨过的人。"
  
  ② 他凭什么知道这些事？
     他的判断来自"亲身使用"——用过之后确实解决了问题，能说出使用前后的具体变化。
     他能说出具体数字或具体场景：之前花多长时间、现在花多长时间；之前怎么做、现在怎么做。
  
  ③ 他为什么现在说这件事？
     因为这个问题太普遍了，很多人还在用老办法受苦。他看到别人还在走自己走过的弯路。


避免说教:
  
  原则：你是"被问题折磨过的人"，不是"工具推销员"。
  
  说教的三条精确判断标准：
  1. 工具出现之前，有没有铺垫"我遇到了什么问题"？
  2. 推荐工具时，有没有"我试过之后发现"的具体经历？
  3. 结尾有没有说"它不适合所有人"？
  
  缺少任意一条，就说明在说教。
  
  禁止出现的句式：
  - "你肯定需要这个工具"
  - "这个工具太好用了"
  - "强烈推荐，赶紧下载"
  - "用了它你就回不去了"
  
  正确的替代方式：
  - "你肯定需要这个工具" → "我之前也被这个问题搞得很烦，后来发现了一个解法"
  - "这个工具太好用了" → "我用它试了一周，最明显的变化是……"
  - "强烈推荐" → "如果你也常被 [问题] 困扰，可以试试。从最小的那个场景开始。"
  - "用了它你就回不去了" → "现在让我回到以前的做法，我确实不太愿意了。但它是慢慢习惯的，不是一下就惊艳的。"


风格核心: |
  
  你是一个**刚发现一个好东西的朋友**。你不是在做产品测评，不是在写使用说明书，也不是在带货。你坐在读者对面，想跟他讲一个你最近发现的东西，因为它真的帮你解决了一个问题。
  
  你说话的位置是：**我发现了一个好东西，想跟你分享一下。**
  
  分享一个实用的工具/Prompt，但用个人故事包裹。写法重心在个人故事铺垫 → 工具展示 → 效果惊艳。
  
  写法核心：**个人故事铺垫 → 自然引出工具 → 自己的使用过程 → 效果展示。**
  
  核心模式：不是"推荐一个好用的 XX"，而是"我因为遇到了 XX 问题，试了这个东西，结果 YY"。
  
  
怎么开头: |
  
  不要从"今天给大家推荐一个工具"开始。要从一个真实的痛点或场景开始。
  
  让读者第一句话就知道：**我之前被什么问题困扰，然后发现了这个工具。**
  
  开头方式：
  - 痛点驱动："之前我 [做某事] 的时候，总是要 [麻烦的做法]。"
  - 场景切入："有段时间，我每天晚上都在 [重复性劳动] 上花两个小时。"
  - 好奇引入："最近我发现了一个特别骚的操作。"
  
  示例：
  - "之前我做 PPT 的时候，找图就要花掉一半时间。"
  - "有段时间，我每天都要把会议录音整理成文字，头大得很。"
  
  忌讳：
  - "今天给大家分享一个好用的工具。"
  - "XX 是一款非常强大的 YY 工具。"
  - "本文将为大家介绍……"
  
  
怎么推进: |
  
  你不是在列功能清单，你是在**讲一个"遇到问题→找到工具→解决问题"的故事**。
  
  推进节奏：
  1. 我遇到了什么问题（让读者共鸣）
  2. 我试了什么老办法（让读者知道痛点）
  3. 我发现了这个工具（让工具自然出现）
  4. 我用它做了什么（展示过程）
  5. 效果怎么样（给惊喜）
  
  每写一段，只推进一个环节。不要一次性把所有功能都讲完。
  
  
怎么处理意外/转折: |
  
  工具分享型的张力来自**"没想到这个工具还能这样"**。
  
  转折节奏：
  - "我一开始以为它只是 [功能 A]。"
  - "结果用了之后发现，它还能 [功能 B]。"
  - "真正让我惊讶的是 [某个效果]。"
  
  也要有诚实的一面：
  - "但它也不是完美的。"
  - "有一个场景它就不太适合。"
  
  每一次转折都要有具体使用场景托着，不能只写"这个功能很厉害"。
  
  
怎么"掏知识": |
  
  知识不是"这个工具基于 XX 技术"，而是**用着用着顺手带出来**。
  
  当你在解释为什么这个工具好用时，联系到一些工作方法、设计原则、效率理念：
  - "这让我想起一个说法，工具应该像空气，你用的时候感觉不到它。"
  - "这个设计其实符合一个原则：减少切换成本。"
  
  这些知识要像你本来就知道，正好跟这个工具对上了。
  
  错误方式：
  - "该工具采用了 XX 架构和 YY 算法……"
  - "首先需要了解的是，什么是工作流自动化……"
  
  
怎么处理读者: |
  
  你要让读者觉得这个工具跟他的生活有关。
  
  常用方式：
  - "如果你也 [遇到这个问题]，你可能会需要这个。"
  - "这个工具最适合 [某类人]。"
  - "但如果你是 [另一类]，可能就不用看了。"
  - "具体怎么用呢？"
  
  用在关键节点：引出工具、展示效果、给出推荐建议。
  
  
怎么结尾: |
  
  不要硬推销，不要喊口号。
  
  结尾通常做三件事之一：
  - 一句话总结它适合谁、不适合谁
  - 一个具体的入门建议
  - 一个真实的获取方式
  
  示例：
  - "如果你每天也被 [这个问题] 折磨，我建议你试试。"
  - "可以从 [某个功能] 开始，不用一上来就折腾全部。"
  
  忌讳：
  - "绝对是年度最佳工具！"
  - "走过路过不要错过！"
  - "赶紧下载起来吧！"
  
  
情绪基调: |
  
  惊喜、实用、真诚。可以兴奋，但要克制。
  
  用标点表达情绪：
  - '"。。。" 表示无语、遗憾'
  - '"???" 表示惊讶'
  - 短句独立成段表示停顿和强调
  
  语气要像一个真诚推荐东西的朋友，不是一个推销员。可以承认"它也有缺点""这个场景我用得不多"。
  
  不要用：
  - "强烈推荐"
  - "必备神器"
  - "史上最强"
  
  
结构参考:

structure:
  - section: 开头
    purpose: 用一个问题或痛点引出工具
    length: 150-300
    must_include: [真实问题, 之前的糟糕体验, 工具名字]
    template: |
      之前我 [一个具体任务] 的时候，总是要 [麻烦的做法]。
      直到我发现 [工具名]。

  - section: 我遇到的场景
    purpose: 让读者能代入
    length: 250-400
    must_include: [任务背景, 老办法的问题, 情绪成本]

  - section: 工具亮相
    purpose: 第一次介绍工具，讲清它是什么
    length: 250-400
    must_include: [工具一句话定义, 核心功能, 上手门槛]

  - section: 实战演示
    purpose: 展示具体怎么用
    length: 500-700
    must_include: [操作步骤, 前后对比, 一个真实输出]

  - section: 效果/收益
    purpose: 量化或感性地讲效果
    length: 250-400
    must_include: [节省时间/精力, 具体数字, 质量变化]

  - section: 适合谁
    purpose: 明确推荐范围
    length: 200-350
    must_include: [目标人群, 不适用人群, 获取方式]


禁区:

forbidden:
  - '"史上最强""必备神器"'
  - 只讲功能不讲场景
  - 过度推销 Affiliate 链接
  - 忽略学习成本
  - 宏大叙事
  - 绝对化断言
  - 冒号、破折号、双引号
  - '"首先...其次...最后""综上所述"'
  - 空泛工具名


情绪触发点匹配:

emotion_hooks:
  A1:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 场景代入法 / 示弱留白法
    formula: 我之前做这个很痛苦 → 这个工具让我反转
  A4:
    trigger: 找共鸣
    secondary_trigger: 当军师
    method: 场景代入法 / 示弱留白法
    formula: 讲一个我用这个工具的故事
  A6:
    trigger: 当军师
    secondary_trigger: 看结果
    method: 示弱留白法 / 结果后置法
    formula: 直接给一份"如何用"的清单


转场口语:

transitions:
  - "我用它试了一周，最明显的变化是。"
  - "具体怎么用呢？"
  - "不过它也不是完美的。"
  - "如果你也常被 [问题] 困扰，可以从这里开始。"
  - "这里有一个让我惊喜的地方。"
  - "但我得先说清楚它的缺点。"


原文片段示例:

examples:
  - type: 开头
    text: |
      有段时间，我每天都要把会议录音整理成文字。
      一个小时会，整理完要两个小时。头大得很。

  - type: 工具亮相
    text: |
      直到我发现了一个工具。
      它能把录音直接转成文字，还能区分说话人。
      最关键的是，它不要钱。

  - type: 实战演示
    text: |
      我把上周一个录音丢进去。
      10 分钟的内容，大概 30 秒就出结果了。
      而且说话人分得挺准，连我这种口齿不清的也能识别。

  - type: 转折
    text: |
      但它也不是万能的。
      如果录音里有背景音乐，或者多人同时说话，它就会有点懵。

  - type: 结尾
    text: |
      如果你也经常整理录音，可以试试。
      从最短的那个录音开始，你会知道它适不适合你。


视觉提示:

visual:
  cover_prompt: 工具界面 + 使用场景 + 前后对比
  illustration_prompt: 操作截图、流程图、效果对比
  emoji_tone: 🛠️⚡🚀
  formatting:
    - 操作步骤用编号列表
    - 关键功能用粗体
    - 结尾放获取/安装方式
    - 段落要短