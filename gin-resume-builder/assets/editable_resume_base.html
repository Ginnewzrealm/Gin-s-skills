<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  /* ===== 基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #555555;
    --text-muted: #666666;
    --border: #d0d0d0;
    --border-strong: #1a1a1a;
    --section-gap: 28pt;
    --entry-gap: 20pt;
    --line-height: 1.65;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 10.5pt;
    line-height: var(--line-height);
    color: var(--text-primary);
    background: #f0f0f0;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== A4 页面容器（屏幕预览与打印尺寸一致） ===== */
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    background: #ffffff;
    padding: 20mm 22mm 24mm 22mm;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    outline: none;
  }

  /* 编辑态提示：页面可点击编辑时给出轻微内框 */
  .page[contenteditable="true"] {
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), inset 0 0 0 1pt rgba(0, 0, 0, 0.12);
  }

  /* ===== 顶部个人信息 ===== */
  .header {
    border-bottom: 1.5pt solid var(--border-strong);
    padding-bottom: 14pt;
    margin-bottom: var(--section-gap);
  }

  .name {
    font-size: 24pt;
    font-weight: 700;
    letter-spacing: 1pt;
    margin-bottom: 8pt;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    font-size: 10pt;
    color: var(--text-secondary);
    letter-spacing: 0.2pt;
  }

  .contact-item { display: flex; align-items: center; gap: 6pt; }

  .contact-item::before {
    content: "";
    display: inline-block;
    width: 0;
    height: 8pt;
    margin: 0 10pt;
    border-left: 0.6pt solid var(--border);
    background: none;
    border-radius: 0;
  }
  .contact-item:first-child::before { display: none; }

  /* ===== 区块标题 ===== */
  .section { margin-bottom: var(--section-gap); }

  .section-title {
    font-size: 13pt;
    font-weight: 700;
    letter-spacing: 2.5pt;
    color: var(--text-primary);
    border-bottom: 1pt solid var(--border-strong);
    padding-bottom: 7pt;
    margin-bottom: 14pt;
    display: flex;
    align-items: baseline;
    gap: 8pt;
  }

  .section-title::before {
    content: "■";
    font-size: 10pt;
    color: var(--text-primary);
  }
  .section-title .en {
    margin-left: 0;
    font-size: 8pt;
    font-weight: 400;
    letter-spacing: 2pt;
    color: var(--text-muted);
  }

  /* ===== 经历条目（条目间细分隔线） ===== */
  .entry {
    margin-bottom: var(--entry-gap);
    padding-bottom: var(--entry-gap);
    border-bottom: 0.5pt solid var(--border);
  }
  .entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  /* 职业休整期条目：视觉弱化处理，避免喧宾夺主 */
  .entry.career-gap .entry-company { color: var(--text-muted); }
  .entry.career-gap .entry-position { color: var(--text-muted); font-style: italic; }
  .entry.career-gap .entry-meta { color: #999999; }
  .entry.career-gap .field-label { background: #777777; }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8pt;
  }

  /* 段头合并一行：公司名加粗 + 职位灰色小字同行，与 13pt 区块标题拉开层级 */
  .entry-left { display: flex; flex-direction: row; align-items: baseline; gap: 8pt; }

  .entry-company { font-size: 10.5pt; font-weight: 700; color: var(--text-primary); }
  .entry-position { font-size: 10pt; font-weight: 400; color: var(--text-muted); }

  .entry-meta {
    font-size: 10pt;
    color: var(--text-muted);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ===== bullet 列表 ===== */
  .bullet-list { list-style: none; padding-left: 2em; margin-top: 4pt; }

  .bullet-list li {
    position: relative;
    padding-left: 14pt;
    margin-bottom: 4pt;
    font-size: 10.5pt;
    color: var(--text-secondary);
    line-height: var(--line-height);
    text-align: justify;
  }

  .bullet-list li::before {
    content: "";
    position: absolute;
    left: 1pt;
    top: 7pt;
    width: 3.2pt;
    height: 3.2pt;
    border-radius: 50%;
    background: var(--text-primary);
  }

  /* 量化数字加粗（由渲染器自动标记 .metric） */
  .metric { font-weight: 700; color: var(--text-primary); white-space: nowrap; }

  /* ===== 字段标签（核心职责/关键业绩/专业能力/荣誉奖项/项目描述/职责与行动/成果与影响） ===== */
  .field-line {
    margin: 4pt 0;
    font-size: 10.5pt;
    color: var(--text-secondary);
    line-height: var(--line-height);
    text-align: justify;
  }
  .field-label {
    display: inline-block;
    margin-right: 8pt;
    padding: 0.5pt 5pt;
    font-size: 8.5pt;
    font-weight: 700;
    color: #ffffff;
    background: var(--border-strong);
    border-radius: 2pt;
    letter-spacing: 1pt;
    vertical-align: 0.5pt;
  }
  .field-label-only { margin-bottom: 0; }

  /* bullet 能力小标题（如「业绩增长：」） */
  .bullet-tag { font-weight: 700; color: var(--text-primary); }

  /* 公司括注简介 */
  .org-note { font-weight: 400; font-size: 9.5pt; color: var(--text-muted); }

  /* ===== 技能区（两列标签网格） ===== */
  .skills-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 5pt 10pt;
    font-size: 10.5pt;
    line-height: var(--line-height);
  }
  .skill-label { font-weight: 700; color: var(--text-primary); }
  .skill-content { color: var(--text-secondary); }

  /* ===== 工具栏（打印时隐藏） ===== */
  .toolbar {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  .toolbar button {
    padding: 8px 16px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .toolbar button:hover { background: #333; }
  .toolbar button.secondary { background: #fff; color: #1a1a1a; border: 1px solid #1a1a1a; }

  .toolbar-hint {
    position: fixed;
    top: 62px;
    right: 20px;
    max-width: 300px;
    font-size: 11px;
    line-height: 1.5;
    color: #999;
    text-align: right;
    z-index: 100;
  }


  /* ===== 主题切换键 ===== */
  .theme-switch { display: flex; gap: 4px; margin-right: 4px; }
  .theme-switch button.active { background: #1a1a1a !important; color: #fff !important; border-color: #1a1a1a !important; }

  /* ===== 打印（导出 PDF） ===== */
  @page { size: A4; margin: 15mm 18mm; }

  @media print {
    html, body {
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    body { background: #fff; padding: 0; }
    .page, .page[contenteditable="true"] {
      width: auto;
      min-height: auto;
      margin: 0;
      padding: 0;
      box-shadow: none;  /* 含编辑态内框阴影，打印时必须去掉 */
    }
    .toolbar, .toolbar-hint { display: none !important; }

    /* 分页保护：条目不截断、标题不孤行 */
    .section { page-break-inside: auto; }
    .section-title { page-break-after: avoid; }
    .entry { page-break-inside: auto; }       /* 长条目允许跨页流动，避免整条被推走留下半空页 */
    .entry-header { page-break-after: avoid; }
    .entry-header { page-break-inside: avoid; }
    .field-line { page-break-inside: avoid; }
    .field-line, .bullet-list li { orphans: 2; widows: 2; }  /* 页首/页尾不留孤行 */
    .field-label-only { page-break-after: avoid; }
    .bullet-list li { page-break-inside: avoid; }
    .skills-grid { page-break-inside: avoid; }
  }

  /* ================= 主题：投行风（藏青+鎏金） ================= */
/* ===== Reference-inspired minimalist single-column style ===== */
  body.theme-bank {

    --bank-blue: #1b6485;

  /* ================= 主题：欧美高端（墨色+灰蓝） ================= */
/* ===== Premium Western editorial style ===== */
  body.theme-editorial {

/* 欧美编辑风：只增强分组和层级，不改变极简/投行主题 */
body.theme-editorial {
  --editorial-ink: #17191c !important;
  --editorial-copy: #555c63 !important;
  --editorial-muted: #747b82 !important;
  --editorial-accent: #315d78 !important;
  --editorial-rule: #cfd3d5 !important;
}
body.theme-editorial .name {
  font-family: Baskerville, "Iowan Old Style", "Times New Roman", "Songti SC", STSong, serif !important;
  font-size: 30pt !important;
  line-height: 1 !important;
  font-weight: 600 !important;
  letter-spacing: 2.8pt !important;
  color: var(--editorial-ink) !important;
}
body.theme-editorial .contact-row {
  font-size: 8.9pt !important;
  line-height: 1.3 !important;
  color: var(--editorial-muted) !important;
}
body.theme-editorial .section { margin-bottom: 25pt !important; }
body.theme-editorial .section-title {
  font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, "PingFang SC", sans-serif !important;
  font-size: 12.5pt !important;
  line-height: 1.25 !important;
  font-weight: 700 !important;
  letter-spacing: .12em !important;
  color: var(--editorial-ink) !important;
  border-bottom: 1pt solid var(--editorial-ink) !important;
  padding-bottom: 8pt !important;
  margin-bottom: 15pt !important;
}
body.theme-editorial .section-title .en {
  font-family: Georgia, "Times New Roman", serif !important;
  font-size: 7.5pt !important;
  line-height: 1 !important;
  letter-spacing: .1em !important;
  color: var(--editorial-muted) !important;
}
body.theme-editorial .entry {
  margin-bottom: 22pt !important;
  padding-bottom: 17pt !important;
  border-bottom: .5pt solid var(--editorial-rule) !important;
}
body.theme-editorial .entry:last-child {
  margin-bottom: 0 !important;
  padding-bottom: 0 !important;
  border-bottom: 0 !important;
}
body.theme-editorial .entry-header { margin-bottom: 9pt !important; }
body.theme-editorial .entry-company {
  font-family: Baskerville, "Iowan Old Style", "Times New Roman", "Songti SC", STSong, serif !important;
  font-size: 11.5pt !important;
  line-height: 1.25 !important;
  font-weight: 600 !important;
  letter-spacing: .025em !important;
  color: var(--editorial-ink) !important;
}
body.theme-editorial .entry-position {
  font-size: 9.5pt !important;
  line-height: 1.3 !important;
  color: var(--editorial-muted) !important;
}
body.theme-editorial .entry-meta {
  font-family: Georgia, "Times New Roman", serif !important;
  font-size: 8.8pt !important;
  line-height: 1.25 !important;
  color: var(--editorial-muted) !important;
}
body.theme-editorial .field-line {
  display: grid !important;
  grid-template-columns: 6em minmax(0, 1fr) !important;
  column-gap: 8pt !important;
  margin: 7pt 0 !important;
  font-size: 9.7pt !important;
  line-height: 1.72 !important;
  color: var(--editorial-copy) !important;
}
body.theme-editorial .field-line .field-label {
  width: 6em !important;
  min-width: 6em !important;
  padding: 0 !important;
  background: transparent !important;
  border: 0 !important;
  white-space: nowrap !important;
  font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, "PingFang SC", sans-serif !important;
  font-size: 10pt !important;
  line-height: 1.35 !important;
  font-weight: 700 !important;
  letter-spacing: .035em !important;
  color: var(--editorial-ink) !important;
}
body.theme-editorial .field-line .field-content { grid-column: 2 !important; min-width: 0 !important; }
body.theme-editorial .field-label-only { display: block !important; margin: 11pt 0 3pt !important; }
body.theme-editorial .field-label-only .field-label { display: inline-block !important; }
body.theme-editorial .bullet-list { margin-top: 4pt !important; }
body.theme-editorial .bullet-list li {
  font-size: 9.7pt !important;
  line-height: 1.72 !important;
  margin-bottom: 6pt !important;
  color: var(--editorial-copy) !important;
}
body.theme-editorial .bullet-list li .bullet-tag {
  font-family: Baskerville, "Iowan Old Style", "Times New Roman", "Songti SC", STSong, serif !important;
  font-size: 10.2pt !important;
  line-height: 1.35 !important;
  font-weight: 700 !important;
  letter-spacing: .03em !important;
  color: var(--editorial-ink) !important;
}
body.theme-editorial .metric {
  font-weight: 400 !important;
  font-family: inherit !important;
}
body.theme-editorial .skills-grid {
  grid-template-columns: 6em minmax(0, 1fr) !important;
  column-gap: 12pt !important;
  font-size: 9.7pt !important;
  line-height: 1.65 !important;
}
body.theme-editorial .skills-grid .skill-label {
  width: 6em !important;
  font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, "PingFang SC", sans-serif !important;
  font-size: 10pt !important;
  font-weight: 700 !important;
  color: var(--editorial-ink) !important;
}
body.theme-editorial .skills-grid .skill-content { color: var(--editorial-copy) !important; }
</style>

<style id="editorial-cleanup-v12">
/* 欧美主题清理：单线、无短竖、无蓝色 */
body.theme-editorial {
  --editorial-accent: #222 !important;
  --editorial-ink: #222 !important;
  --editorial-copy: #555 !important;
  --editorial-muted: #777 !important;
  --editorial-rule: #d8d8d8 !important;
}
/* 联系方式下方只保留 header 的一条底线 */
body.theme-editorial .header { border-bottom: 1.2pt solid #222 !important; }
body.theme-editorial .header::after { display: none !important; content: none !important; }
/* 区块标题取消左侧短竖和色块，只保留底部细线 */
body.theme-editorial .section-title {
  border-left: 0 !important;
  border-bottom: 1pt solid #222 !important;
  background: transparent !important;
  color: #222 !important;
  padding-left: 0 !important;
}
body.theme-editorial .section-title .en { color: #777 !important; }
body.theme-editorial .contact-item:last-child { color: #555 !important; }
body.theme-editorial .bullet-list li::before { background: #222 !important; }
body.theme-editorial .field-label,
body.theme-editorial .bullet-tag,
body.theme-editorial .ability-tag,
body.theme-editorial .skill-label { color: #222 !important; }
body.theme-editorial .field-label { background: transparent !important; }
</style>

<style id="editorial-entry-spacing-v13">
/* 欧美主题：相邻条目只保留一根分隔线 */
body.theme-editorial .entry {
  border-bottom: 0 !important;
  padding-bottom: 0 !important;
  margin-bottom: 18pt !important;
}
body.theme-editorial .entry + .entry {
  border-top: .5pt solid var(--editorial-rule) !important;
  padding-top: 17pt !important;
}
body.theme-editorial .entry:last-child {
  margin-bottom: 0 !important;
}
/* 正文缩进统一：字段正文固定从第二列开始，bullet 正文统一从同一缩进线开始 */
body.theme-editorial .field-line .field-content {
  padding-left: 0 !important;
  text-indent: 0 !important;
}
body.theme-editorial .bullet-list {
  padding-left: 1.25em !important;
  margin-left: 0 !important;
}
body.theme-editorial .bullet-list li {
  padding-left: 10pt !important;
  text-indent: 0 !important;
}
</style>
<style id="print-final">
/* 打印收口必须置于所有主题之后；只清除纸张外层装饰，保留正文配色。 */
@media print {
  html, body, body.theme-bank, body.theme-editorial {
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  body .page, body .page[contenteditable],
  body.theme-bank .page, body.theme-bank .page[contenteditable],
  body.theme-editorial .page, body.theme-editorial .page[contenteditable] {
    width: auto !important;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
    background: #fff !important;
    box-shadow: none !important;
    outline: none !important;
  }
}
</style>
</head>
<body>
  <div class="toolbar">
    <div class="theme-switch">
      <button class="secondary" data-theme="">极简</button>
      <button class="secondary" data-theme="bank">投行</button>
      <button class="secondary" data-theme="editorial">欧美</button>
    </div>
    <button class="secondary" onclick="togglePreview()">预览/编辑</button>
    <button class="secondary" onclick="downloadResume()">保存修改</button>
    <button class="secondary" onclick="resetContent()">还原</button>
    <button onclick="window.print()">导出 PDF</button>
  </div>
  <div class="toolbar-hint">「预览/编辑」修改正文，改动自动暂存在本浏览器；「保存修改」把含改动的完整 HTML 下载到本地；「还原」清空改动恢复初始内容；导出 PDF 时取消勾选「页眉和页脚」，边距选「默认」</div>

  <div class="page" id="page" contenteditable="true" spellcheck="false">
{{BODY}}
  </div>

  <script>
    function setTheme(t) {
      document.body.classList.remove('theme-bank', 'theme-editorial');
      if (t) document.body.classList.add('theme-' + t);
      var btns = document.querySelectorAll('.theme-switch button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-theme') === t);
      }
      document.body.setAttribute('data-theme', t || 'minimal');
    }
    (function () {
      var btns = document.querySelectorAll('.theme-switch button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].onclick = function () { setTheme(this.getAttribute('data-theme')); };
      }
      var saved = document.body.getAttribute('data-theme') || 'minimal';
      setTheme(saved === 'minimal' ? '' : saved);
    })();

    function togglePreview() {
      var page = document.getElementById('page');
      var editing = page.getAttribute('contenteditable') === 'true';
      page.setAttribute('contenteditable', editing ? 'false' : 'true');
      document.body.style.background = editing ? '#ffffff' : '#f0f0f0';
      page.style.boxShadow = editing ? 'none' : '';
    }

    /* ===== 内容自动暂存 + 保存修改/还原 ===== */
    var CONTENT_KEY = 'locked-resume-v1:' + location.pathname + ':' + (document.title || 'resume');
    var pageEl = document.getElementById('page');
    var saveTimer = null;
    /* 嵌入内容指纹：文件更新后，浏览器里的旧暂存自动作废，不再覆盖新内容 */
    function docRev() {
      var h = 0, s = pageEl.innerHTML;
      for (var i = 0; i < s.length; i++) { h = ((h * 31) + s.charCodeAt(i)) | 0; }
      return 'r' + (h >>> 0).toString(36);
    }
    var REV = docRev();
    function saveContent() {
      try { localStorage.setItem(CONTENT_KEY, JSON.stringify({ rev: REV, html: pageEl.innerHTML })); } catch (e) {}
    }
    pageEl.addEventListener('input', function () {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveContent, 500);
    });
    (function () {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(CONTENT_KEY) || 'null'); } catch (e) {}
      if (saved && saved.rev === REV && saved.html) {
        pageEl.innerHTML = saved.html;  /* 同一文件版本的暂存才恢复 */
      } else {
        try { localStorage.removeItem(CONTENT_KEY); } catch (e) {}  /* 旧版暂存作废 */
      }
    })();
    function resetContent() {
      try { localStorage.removeItem(CONTENT_KEY); } catch (e) {}
      location.reload();
    }
    function downloadResume() {
      saveContent();
      var clone = document.documentElement.cloneNode(true);
      var editables = clone.querySelectorAll('[contenteditable]');
      for (var i = 0; i < editables.length; i++) editables[i].setAttribute('contenteditable', 'false');
      var html = '<!DOCTYPE html>\n' + clone.outerHTML;
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (document.title || '简历').replace(/[\\/:*?"<>|]/g, '') + '-修改版.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }
  </script>
</body>
</html>
