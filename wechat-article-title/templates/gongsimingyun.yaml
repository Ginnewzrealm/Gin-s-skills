# 微信公众号长文写作 —— YAML 风格模板
# =============================================================================
# 风格：公司命运型
# 核心：一家公司的转折点，命运的齿轮在某个瞬间咬合或崩坏
# =============================================================================

meta:
  name: 公司命运型
  id: corporate-fate
  description: |
    适合写公司/组织的命运转折时刻——融资、裁员、技术路线选择、
    权力更迭、生死存亡。作者是一个坐在现场旁听席上的观察者，
    冷静还原那个关键节点。
  preferred_angles:
  - A2
  - A3
  default_word_count: 3500
  match_signals:
  - 公司命运、转折点、关键决策、现场还原
  - 企业危机、命运时刻、旁听席视角
  - 一个决定公司走向的关键瞬间
  - 把读者带到那个改变命运的现场
风格核心: |
  你是一个**坐在旁听席上的观察者**。不是在转述新闻通稿，也不是在做财报分析。
  你坐在法庭、会议室、发布会现场的后排，把那个决定命运的时刻原原本本讲出来。

  你说话的位置是：**我看到了那个瞬间，现在我把现场还原给你。**

  不是"我来告诉你这家公司发生了什么"，而是"我带你去那个现场，你亲眼看看那个转折是怎么发生的"。

  写法核心：**现场还原 + 细节白描 + 命运的荒谬感。**

  核心模式：让读者感觉自己就坐在那里，看见那个人做了那个决定，听见那句话。

怎么开头: |
  不要概述公司历史，不要列数据背景。直接把人扔进一个**具体的时空场景**。

  **钩子选择：** 首选「场景钩」「冲突钩」，备选「悬念钩」「反差钩」。
  用2个钩子叠用——先用「场景钩」把读者拉进现场，再用「冲突钩」制造"这不对"的悬念。

  **情绪触发策略（策略层）：** 本风格核心触发「看结果」和「辨真伪」。
  读者想知道"这件事到底怎么回事"。开场的现场感越强，读者越愿意坐下来"旁听"整场戏。

  **四步开场法（锚点→缺口→方向）：**
  1. 锚点：时间地点 + 在场人物 + 具体动作/对白
  2. 缺口：一个反常的细节或让全场安静的问题
  3. 方向：暗示"这是一个关于命运转折的故事"
  4. 关联：让读者觉得"这件事比我想的更复杂"

  让读者第一句话就知道：**什么时间、什么地方、谁在场、正在发生什么。**

  开头方式：
  - 时间地点起手："4月30日，加州奥克兰联邦法院……"
  - 在场人物 + 具体动作："马斯克坐在第三排，双手交叉，看着原告席。"
  - 一句对白定调："OpenAI首席律师站起来，问了一个让整个法庭安静了三秒的问题。"
  - 一个细节锁定画面："他那天穿了一件深灰色西装，和三个月前听证会那件一模一样。"

  示例：
  - "4月30日，加州奥克兰联邦法院，马斯克诉OpenAI案进入第四天。"
  - "现场，OpenAI首席律师William Savitt站起来，问了一个让整个法庭安静了三秒的问题：xAI是否蒸馏了OpenAI的模型？"

  忌讳：
  - "近日，某科技公司……"
  - "作为一家成立于2015年的企业……"
  - "据公开资料显示……"

怎么推进: |
  你不是在列时间线，你是在**带读者看一出戏的起承转合**。

  每写一段，只完成一件事：
  - 这一段讲谁做了什么事
  - 下一段讲对方的反应
  - 再下一段讲这个反应导致了什么后果
  - 然后你停下来，告诉读者这一幕有多荒诞

  节奏要像庭审笔录：一问一答之间，命运的走向就变了。

  不要一次性交代结局。让读者跟着你一起看：
  - "然后，他问了一个问题。"
  - "对面沉默了三秒。"
  - "这三秒，改变了整件事的走向。"

  每一个关键节点都要有一个**具体动作**托着——
  "他站起来""她低头翻了翻笔记本""法官往前倾了一下身子"。

怎么处理意外/转折: |
  张力来自**逻辑的荒谬感**。最荒诞的部分往往不是虚构的，是现实自己长成那样的。

  把你要讲的内容按荒谬程度排序：
  - 第一层：事情本身
  - 第二层：当事人怎么说的
  - 第三层：实际结果和他说的话之间那个裂缝

  结构像一场庭审：起诉、举证、反诘，最后让事实自己说话。

  示例：
  - "他起诉对方不正当竞争，说对方靠垄断打压xAI。"
  - "结果，xAI自己的做法，和他起诉的内容一模一样。"
  - "这个事实，让整场诉讼变成了一面镜子。"

怎么"掏知识": |
  知识不是"科普时间"，而是**现场的一个背景注脚**——
  突然想起一条信息，刚好能解释眼前这一幕为什么会发生。

  你看到某件事，然后顺嘴提一句：
  - "这让人想起三年前那场收购案里的同一个条款。"
  - "他说的这个数字，恰好是对方上一轮融资的零头。"
  - "熟悉那场听证会的人，看到这一幕大概会笑出来。"

  这些知识要像你本来就知道，正好跟眼前的事对上了。

  错误方式：
  - "首先，我们需要了解一下什么是反垄断法。"
  - "下面我来科普一下OpenAI的公司架构。"

怎么处理读者: |
  你带着读者旁听，偶尔转头跟他说一句悄悄话。

  常用方式：
  - "不得不说，这一幕的讽刺含量已经溢出屏幕了。"
  - "如果你知道去年那个数字，你会觉得这句话更好笑。"
  - "说白了就是：为了赢这场官司，必须先承认自己不行。"
  - "这里有一个细节，值得停下来看一眼。"

  用在关键节点：反讽发现、事实和说辞对不上时、局势突然逆转时。

怎么结尾: |
  不要总结"三点启示"，不要升华。

  结尾做三件事之一：
  - 回到开场那个画面，但读者已经能看出不一样的东西了
  - 当事人说了一句话，这句话就是结尾——让他自己说完，然后你停笔
  - 一个让人想很久的矛盾：赢了还是输了？成功了还是失败了？

  示例：
  - "承认了，但没完全承认；坦白了，但留了余地。"
  - "说白了就是：为了赢这场官司，必须先承认自己不行。"
  - "他坐在那里，赢了这一局，但所有人都知道他输了更重要的东西。"

  忌讳：
  - "综上所述……"
  - "本文分析了……三点启示……"
  - "这个案例告诉我们……"

情绪基调: |
  冷静、克制、讽刺。不喊口号，不煽情。

  用细节和对比传递情绪：
  - "他三个月前说过一模一样的话，只是换了个法庭。"
  - "这个数字是他们上次公开数据的三倍，但没有人追问。"
  - "全场安静了三秒。三秒之后，大家都知道结果了。"

  不要用：
  - "令人震惊的是……"
  - "太荒谬了！"
  - "这一幕让人无语凝噎。"

  要用白描让读者自己感到荒谬。

结构参考:
- section: 时空锚点
  purpose: 把读者扔进具体的时空场景
  length: 150-300
  must_include:
  - 时间地点
  - 在场人物
  - 具体动作或对白
  template: |
    4月30日，加州奥克兰联邦法院，马斯克诉OpenAI案进入第四天。
    现场，OpenAI首席律师William Savitt站起来，问了一个让整个法庭安静了三秒的问题。

- section: 事件静帧
  purpose: 只交代看懂这一幕必须知道的事情
  length: 200-350
  must_include:
  - 关键背景
  - 悬念或矛盾
  template: |
    他问的是：xAI是否蒸馏了OpenAI的模型？
    这个问题本身就很荒谬。蒸馏是OpenAI也在用的技术。
    但原告的律师提了这个问题——意味着他们承认了自己也在用。

- section: 现场切面一
  purpose: 第一个关键场景，让读者看到局势
  length: 300-500
  must_include:
  - 具体动作或对白
  - 在场人的反应
  template: |
    然后，马斯克那边的律师承认了。
    承认了xAI蒸馏了OpenAI的模型。
    承认了——但说这是"合理使用"。
    全场安静了三秒。三秒之后，大家都知道结果了。

- section: 现场切面二
  purpose: 推进，矛盾升级或反转出现
  length: 300-500
  must_include:
  - 新的信息揭示
  - 对比/反讽
  template: |
    三年前，马斯克起诉OpenAI的时候，说的是一套完全不同的话。
    他说OpenAI变成了他最初反对的样子。
    现在他做的，和他当初说的，中间隔着一面镜子。

- section: 底层事实
  purpose: 最关键的事实或判断
  length: 200-350
  must_include:
  - 核心证据
  - 事实和说辞的裂缝
  template: |
    说白了就是：为了赢这场官司，必须先承认自己不行。
    这个事实，让整场诉讼变成了一场黑色喜剧。

- section: 余声
  purpose: 停在一个让人想很久的地方
  length: 150-250
  must_include:
  - 回到某个意象
  - 不做总结
  template: |
    承认了，但没完全承认；坦白了，但留了余地。
    他坐在那里，赢了这一局，但所有人都知道他输了更重要的东西。

禁区: |
  - "近日""最近""不久前"等模糊时间词
  - 公司发展历程回顾（"成立于…""最早做的是…"）
  - 财报数据堆砌不转化为现场叙事
  - 作者本人情绪判断（"这太让人震惊了""真是荒谬绝伦"）
  - "让我们来看看""接下来我们分析"
  - "首先...其次...最后""综上所述"
  - "某某表示""某某指出""某某称"——要用 > 引号体让人物自己说话
  - 二元对立结论（"他成功了""他彻底失败了"）
  - 鸡汤升华（"这个故事告诉我们，坚持就是胜利"）
  - 科技报道套话（"在数字化浪潮的推动下""随着AI技术的快速发展"）

情绪触发点匹配:
  A2:
    trigger: 看结果
    secondary_trigger: 辨真伪
    method: 事实对账法
    formula: 他这么说 → 他实际这么做 → 中间那个裂缝就是全部真相
  A3:
    trigger: 纠错欲
    secondary_trigger: 辨真伪
    method: 现场还原法
    formula: 大家都在传这件事 → 我带你去看现场发生了什么 → 然后你自己判断

转场口语: |
  - "然后，他问了一个问题。"
  - "对面沉默了几秒。"
  - "这里有一个细节，值得停下来看一眼。"
  - "不得不说，这一幕的讽刺含量已经溢出屏幕了。"
  - "说白了就是："
  - "如果你知道去年那个数字，你会觉得这句话更好笑。"
  - "全场安静了。"
  - "他在三个月前说过一模一样的话，只是换了个地方。"

原文片段示例:
- type: 开头
  text: |
    4月30日，加州奥克兰联邦法院，马斯克诉OpenAI案进入第四天。
    现场，OpenAI首席律师William Savitt站起来，问了一个让整个法庭安静了三秒的问题：xAI是否蒸馏了OpenAI的模型？
- type: 推进
  text: |
    然后，马斯克那边的律师承认了。
    承认了xAI蒸馏了OpenAI的模型。
    承认了——但说这是"合理使用"。
- type: 掏知识
  text: |
    熟悉这一行的人，看到"蒸馏"两个字大概会笑出来。
    蒸馏是AI领域最常见的模型压缩技术，大模型教小模型，把能力"蒸馏"过去。OpenAI自己也在用。
    但问题是：你一边起诉别人搞垄断，一边自己用着别人的模型来训练。
    这个画面，怎么看都像在照镜子。
- type: 结尾
  text: |
    承认了，但没完全承认；坦白了，但留了余地。
    说白了就是：为了赢这场官司，必须先承认自己不行。

视觉提示:
  cover_prompt: 法庭/会议室现场 + 人物 + 对峙感
  illustration_prompt: 现场关键瞬间、人物表情细节、关键对白截图或信息图
  emoji_tone: "⚖️👀📋"
  formatting: |
    - 关键对白用 > 引用块，不加"他说"
    - 关键数字用粗体
    - 每400-500字插入一张图
    - 小标题用短句，3-6字，画面感
    - 结尾段落独立成段

