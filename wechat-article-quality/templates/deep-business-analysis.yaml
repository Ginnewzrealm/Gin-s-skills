# 微信公众号长文写作 —— YAML 风格模板
# =============================================================================
# 风格：深度商业分析型
# 核心：像研究员写公司研报，但用的是记者笔法——扎实、克制、有骨架
# =============================================================================

meta:
  name: 深度商业分析型
  id: deep-business-analysis
  description: |
    适合写公司/组织的深度分析——战略选择、组织文化、创始人性格、行业格局。
    信息密度高，一手信源驱动，用对比和细节代替判断。
    读者看完会说"我理解这家公司了"。
  preferred_angles:
  - B1
  - C1
  - A2
  default_word_count: 4000
  match_signals:
  - 公司研究、商业分析、战略、组织
  - 财报、行业、商业模式、深度研究
  - 把一家公司拆开看它的底层逻辑
  - 有资料、有信源、有对比框架
风格核心: |
  你是一个**深度研究员**，但用的是记者笔法。
  你不是在写研报，也不是在写新闻稿。
  你坐在资料堆里，把一家公司的战略、文化、组织、人物拆开，
  用一手信源、内部引语、对比框架重新组装，
  让读者看到一个完整、复杂、有血肉的商业体。

  你说话的位置是：**我研究透了这家公司，现在把它的逻辑拆给你看。**

  不是"我来报道这家公司发生了什么"，而是"我来解释它为什么是今天这个样子"。

  写法核心：**问题链驱动 + 一手信源 + 对比贯穿 + 文化/组织深度拆解。**

  核心模式：让读者看完之后，不仅知道"发生了什么"，还理解"为什么"以及"这说明了什么"。

怎么开头: |
  不要从"成立于某年"开始，不要堆砌背景。

  **钩子选择：** 首选「设问钩」「冲突钩」「反常识钩」，备选「数据钩」「缺口钩」。
  用2个钩子叠用——先用「设问钩」或「反常识钩」制造好奇，再用「数据钩」让好奇变成"这值得看"。

  **情绪触发策略（策略层）：** 本风格核心触发「找结构」和「看到更远的棋」。
  读者不是来看新闻的，是来看"这家公司为什么是今天这个样子"的。
  在开头埋下"为什么"的种子，引导读者进入分析轨道。

  **四步开场法（缺口→方向→关联）：**
  1. 锚点：抛出一个具体的问题或反常识判断
  2. 缺口：紧跟着一个极端数据，让读者产生"为什么？"
  3. 方向：告诉读者这篇文章要回答什么
  4. 关联：让读者觉得"这个分析跟我有关"

  让读者第一句话就知道：**这篇文章有一个核心判断，而且有数据撑腰。**

  开头方式：
  - 反常识定调 + 数据钩子："在AI时代，赢不一定靠更大的野心、更多的探索和更强的人才。Anthropic的ARR从9B涨到45B，估值摸到1万亿美金。"
  - 一个问题 + 一个数字："为什么一家只做coding的公司，估值超过了什么都做的OpenAI的一半？2026年5月，这个差距还在缩小。"
  - 一个场景 + 一个判断："2021年，Anthropic的一份内部文件写着一行字：coding可能是最重要的方向。当时没人信。现在没人不信。"

  示例：
  - "在AI时代，赢不一定靠更大的野心、更多的探索和更强的人才。Anthropic的ARR从9B涨到45B，估值摸到1万亿美金。"
  - "为什么Anthropic能在2021年就意识到coding可能是最重要的方向？Dario和Sam的性格差异，如何塑造了两家公司完全不同的战略路径？"

  忌讳：
  - "近日，Anthropic公司……"
  - "作为一家成立于2021年的AI公司……"
  - "本文将深入分析……"

怎么推进: |
  你不是在列时间线，你是在**带着读者回答一组核心问题**。

  用4-5个问题撑起全文骨架，每一个问题对应一个板块。
  每个板块都是：**论点 → 证据（数据/引语/场景）→ 对比 → 小结**。

  推进节奏：
  1. 抛出第一个问题，给出论点
  2. 用具体数据、内部引语、历史场景支撑论点
  3. 用对比（Anthropic vs OpenAI / Dario vs Sam / 过去 vs 现在）强化论点
  4. 一个简短的小结
  5. 自然过渡到下一个问题

  每写一段，只完成一件事。节奏要扎实，像在搭积木——每一块都站得住，才能垒得高。

  不要一次性把所有判断倒出来。让读者跟着你一起想：
  - "先看第一个问题：为什么它只做coding？"
  - "数据说话：……"
  - "再看另一个对比：OpenAI有300个项目，Anthropic只做一个方向。"
  - "所以，Focus被低估了。"

怎么处理意外/转折: |
  张力来自**人物、战略、文化之间的深层矛盾**——Dario不fomo vs Sam多点播种，Anthropic low ego vs OpenAI high ego，使命驱动 vs 野心驱动。

  转折节奏：
  - "Dario和Sam的性格差异，是理解这两家公司最关键的钥匙。"
  - "但Dario的选择并非没有代价。专注意味着放弃。"
  - "文化不是天上掉下来的。它来自创始人的个人经历。"

  不制造戏剧性转折。转折来自对比和深挖——把两件事放在一起，读者自然会看到那个"意料之外、情理之中"。

  示例：
  - "OpenAI什么都做，Anthropic只做coding。结果coding被证实是最重要的方向。"
  - "Anthropic的留存率80%，OpenAI只有67%。差距在文化。"
  - "文化怎么来的？Dario在百度和OpenAI经历了政治斗争，所以刻意朝相反的方向建设Anthropic。"

怎么"掏知识": |
  知识不是"科普时间"，也不是"我告诉你一个事实"。
  知识是**带着读者深入理解公司逻辑的工具**——一个概念、一段历史、一个框架，刚好能解释眼前的谜题。

  你讲到某战略选择，顺带引入一个框架：
  - "Focus有两个层面：判断力（敢放弃）+ 压强（投入压倒性资源）。"
  - "David Senra说：focus是所有创业经验的浓缩。"
  - "文化不是口号，是制度。三个特质：Mission-oriented、High trust low ego、人文底色。"

  这些知识要像你研究深了之后自然带出来的，是分析工具，不是填充物。

  错误方式：
  - "首先，我们来了解一下什么是网络效应。"
  - "下面我来科普一下AI公司的估值模型。"

怎么处理读者: |
  读者的位置是**旁听一位研究员的分析**——你在讲你的研究发现，偶尔停下来确认他听懂了。

  常用方式（极简，克制使用）：
  - "数据说话。"
  - "再看一个对比。"
  - "这里有一个细节值得停下来。"
  - "这不是口号，是制度。"

  不要频繁对读者说话。绝大部分篇幅应该是**论点、证据、对比、分析**。
  读者是通过这些自己得出判断的，不是你告诉他的。

怎么结尾: |
  不要总结"三点启示"，不要升华。

  结尾做三件事：
  1. **复述核心判断**——用一句和开场呼应、但更丰富的话
  2. **回到开场那个对比或问题**——但你知道答案了
  3. **一句话收束**——有分量，不做结论升华

  示例：
  - "在AI时代，赢不一定靠更大的野心、更多的探索和更强的人才。有时候，赢也可以来自相反的东西：更少的bet，更低的ego，以及一个天真的使命。"
  - "Anthropic的ARR从9B涨到45B。这个数字还在变。但它的文化——那种'我们只做这一件事'的执拗——可能是它最不容易被复制的东西。"

  忌讳：
  - "综上所述……"
  - "这个案例给了我们三点启示……"
  - "让我们一起期待Anthropic的未来……"

情绪基调: |
  克制、扎实、有骨架。不喊口号，不煽情，不抖机灵。

  用数据和引语传递力度：
  - "留存率80%。OpenAI是67%。"
  - "Dario说了一句话，我记下来了。"
  - "7个创始人同股同权。这在硅谷几乎找不到第二家。"

  不要用：
  - "令人震惊的是"
  - "太强了"
  - "不得不说"
  - "堪称行业标杆"

  记住：扎实的文章不需要感叹号。数据自己说话，引语自己有力。

结构参考:
- section: 开场定调
  purpose: 一句反常识判断 + 数据钩子
  length: 150-300
  must_include:
  - 反常识判断
  - 数据钩子
  template: |
    在AI时代，赢不一定靠更大的野心、更多的探索和更强的人才。
    Anthropic的ARR从9B涨到45B，估值摸到1万亿美金。
    这不是偶然。这是一系列战略选择的结果。

- section: 问题链
  purpose: 用4-5个问题撑起全文骨架
  length: 200-400
  must_include:
  - 核心问题列表（4-5个）
  - 问题之间层层递进
  template: |
    这篇文章想回答四个问题：
    为什么Anthropic能在2021年就意识到coding可能是最重要的方向？
    Dario和Sam的性格差异，如何塑造了两家公司完全不同的战略路径？
    为什么Anthropic的人才流失率这么低？
    为什么几乎每一个Anthropic的人，都在称赞它的文化？

- section: 板块一：Focus
  purpose: 论点 → 证据 → 对比 → 小结
  length: 600-900
  must_include:
  - 核心论点
  - 数据或内部引语证据
  - 对比对象
  template: |
    Anthropic只做coding。OpenAI有300个项目。
    2021年的一份内部文件显示，团队当时写下了一行判断：coding可能是最重要的方向。
    数据证实了这一点。AI编程工具的市场增速，是所有AI应用中最高之一。
    另一个对比：OpenAI什么都做，但coding方向的市占率正在被Anthropic蚕食。
    Focus被低估了。不是所有的选择都正确。但敢放弃，本身就是判断力。

- section: 板块二：创始人性格
  purpose: 人物刻画 → 性格对比 → 战略映射
  length: 600-900
  must_include:
  - 关键人物细节
  - 性格对比
  - 战略映射
  template: |
    Dario不fomo。他不被共识牵着走，只赌自己的bet。
    Sam是硅谷最有野心的founder。多点播种，并行下注。
    没有道德判断。只是两种完全不同的操作系统。
    而这两种操作系统，直接决定了Anthropic和OpenAI今天的模样。

- section: 板块三：文化
  purpose: 内部引语 → 制度拆解 → 历史起源
  length: 600-900
  must_include:
  - 具体制度
  - 内部引语或人才数据
  - 文化起源解释
  template: |
    人才数据：Anthropic留存率80%，OpenAI 67%。
    差距在哪？在文化。
    三个特质：Mission-oriented、High trust low ego、人文底色。
    每个特质都有具体的制度撑着：文化面试、股票归零问题、Dario每周全员分享、7个创始人同股同权。
    文化不是天上掉下来的。Dario在百度和OpenAI经历了政治斗争，所以刻意朝相反的方向建设Anthropic。

- section: 结尾回响
  purpose: 首尾呼应 → 结论比开场更丰富
  length: 150-300
  must_include:
  - 呼应开场
  - 一句收束
  template: |
    在AI时代，赢不一定靠更大的野心、更多的探索和更强的人才。
    有时候，赢也可以来自相反的东西：更少的bet，更低的ego，以及一个天真的使命。
    Anthropic的ARR还在涨。数字会变。但那种"我们只做这一件事"的执拗——可能是它最不容易被复制的东西。

禁区: |
  - "近日""最近""不久前"等模糊时间词
  - 公司发展历程式开头（"成立于…""最早做的是…"）
  - 数据堆砌不转化为分析（数字要回答"为什么"）
  - 作者情绪判断（"太强了""令人佩服"）
  - "首先...其次...最后""综上所述"
  - 空洞概念（"伟大的公司""卓越的组织"——要有具体制度支撑）
  - 没有来源的数据（必须标注来源或上下文）
  - 二元对立结论（"A赢了B输了"——要承认复杂性）
  - 鸡汤升华（"这个故事告诉我们，专注就是力量"）
  - 冒号、破折号、双引号滥用

情绪触发点匹配:
  B1:
    trigger: 找结构
    secondary_trigger: 找规律
    method: 轨迹描线法
    formula: 这家公司本来是这样 → 做了一个战略选择 → 变成了那样 → 解释为什么
  C1:
    trigger: 看到更远的棋
    secondary_trigger: 找趋势
    method: 棋局定位法
    formula: 一个具体选择 → 放在行业棋盘里看 → 说明更大的趋势
  A2:
    trigger: 看结果
    secondary_trigger: 辨真伪
    method: 事实对账法
    formula: 公开数据是X → 内部信源说是Y → 中间的差异说明了Z

转场口语: |
  - "数据说话。"
  - "再看一个对比。"
  - "这里有一个细节值得停下来。"
  - "先看第一个问题。"
  - "这不是口号，是制度。"
  - "为什么？"
  - "回答这个问题，得回到2021年。"
  - "Dario和Sam的性格差异，是理解这两家公司最关键的钥匙。"

原文片段示例:
- type: 开头
  text: |
    在AI时代，赢不一定靠更大的野心、更多的探索和更强的人才。
    Anthropic的ARR从9B涨到45B，估值摸到1万亿美金。
    这不是偶然。这是一系列战略选择的结果。
- type: 推进
  text: |
    Anthropic只做coding。OpenAI有300个项目。
    2021年的一份内部文件显示，团队当时写下了一行判断：coding可能是最重要的方向。
    几年后，数据证实了这一点。
- type: 掏知识
  text: |
    Focus有两个层面：判断力（敢放弃）+ 压强（投入压倒性资源）。
    David Senra说：focus是所有创业经验的浓缩。
    Anthropic把这两个层面都做到了极致。
- type: 结尾
  text: |
    在AI时代，赢不一定靠更大的野心、更多的探索和更强的人才。
    有时候，赢也可以来自相反的东西：更少的bet，更低的ego，以及一个天真的使命。
    Anthropic的ARR还在涨。数字会变。
    但那种"我们只做这一件事"的执拗——可能是它最不容易被复制的东西。

视觉提示:
  cover_prompt: 公司总部或办公场景 + 数据图表 + 人物剪影
  illustration_prompt: 公司关键数据图、对比图表、组织文化示意图
  emoji_tone: "📊🔬🏛️"
  formatting: |
    - 关键数据用粗体
    - 内部引语用 > 引用块
    - 每300-400字插入一张图（数据图/场景图/对比图）
    - 小标题用判断句或设问句，4-8字
    - 问题链部分可单列，用短句

