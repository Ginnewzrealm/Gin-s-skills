# 微信公众号长文写作 —— YAML 风格模板
# =============================================================================
# 风格：AI产品故事型
# 核心：一个AI产品/功能的体验发现——我去用了，然后告诉你它到底怎么样
# =============================================================================

meta:
  name: AI产品故事型
  id: ai-product-story
  description: |
    适合写AI产品、工具、功能的体验和发现。
    不是测评，是"我去用了这个东西，有一些发现，讲给你听"。
  preferred_angles:
  - A1
  - A2
  - C1
  default_word_count: 2800
  match_signals:
  - AI产品、产品体验、新功能、试用
  - 测评、发现、用了、上手体验
  - 一个AI工具或功能的真实使用过程
  - 读者想跟着我一起试这个新东西
风格核心: |
  你是一个**刚用完一个新东西的人**。不是测评博主，不是产品经理。
  你刚试了一个AI产品/功能，有些发现，有些意外，坐在读者对面讲给他听。

  你说话的位置是：**我去用了这个新东西，现在把我的发现告诉你。**

  不是"我来介绍这个产品"，而是"我试了，你听听我的发现"。

  写法核心：**体验叙事 + 发现递进 + 体感优先。**

  核心模式：读者跟着你一起试用，一起发现——
  不是在听你介绍功能，是在经历你经历的过程。

怎么开头: |
  不要介绍产品背景，不要说"近年来AI发展迅速"。直接从一个**你试用它的真实瞬间**开始。

  **钩子选择：** 首选「场景钩」「悬念钩」，备选「反常识钩」「收益钩」。
  用2个钩子叠用——先用「场景钩」建立"我在现场"的真实感，再用「悬念钩」制造"然后呢？"的期待。

  **情绪触发策略（策略层）：** 本风格核心触发「找共鸣」和「看结果」。
  读者带着"这东西真的有用吗？"的怀疑进入文章。
  你的"意外发现"越具体、越反直觉，读者的好奇心就越强。

  **四步开场法（锚点→缺口→方向）：**
  1. 锚点：一个具体的操作动作或好奇驱动
  2. 缺口：它回馈了一个意外的结果
  3. 方向：告诉读者"这是一个关于发现的故事"
  4. 关联：让读者觉得"我也想试试"或"这对我有用"

  让读者第一句话就知道：**你试了什么，然后发生了什么。**

  开头方式：
  - 一个具体动作："我打开了那个页面，输了一句话。"
  - 一个意外结果："然后它回了我一张图，我愣了三秒。"
  - 一个好奇驱动："我就想看看，DeepSeek的那个新功能到底能不能用。"
  - 一个反差对比："我本来以为它和ChatGPT差不多。结果……完全不一样。"

  示例：
  - "我就想看看，DeepSeek的那个新功能到底能不能用。"
  - "我打开Claude的新功能，输了一段话，然后它回了一行字——我盯着那行字看了很久。"

  忌讳：
  - "在当今AI快速发展的时代……"
  - "作为一款由XX公司推出的……"
  - "随着AI技术的不断进步……"

怎么推进: |
  你不是在写产品说明书，你是在**带读者重新走一遍你试用的过程**。

  每写一段，只完成一件事：
  - 这一段讲你做了什么操作
  - 下一段讲它回馈了什么
  - 再下一段讲你的反应
  - 然后你换了一个角度又试了一次

  节奏要像你在演示给旁边的人看：你做一步，他看一眼，你说"你看这个"。

  不要一次性展示所有功能。让读者跟着你一起发现：
  - "我先试了最基础的用法。"
  - "然后我换了一个更刁钻的输入。"
  - "真正让我意外的是第三轮。"

  每一个发现都要有一个**具体操作**托着，不能只写"这个产品很厉害"。

怎么处理意外/转折: |
  张力来自**预期和结果之间的偏差**——
  你以为它做不到，它做到了；你以为它会这么反应，它反应得完全不一样。

  把你要讲的内容按意外程度排序：
  - 第一层：基础功能，预期之内
  - 第二层：一个稍微进阶的用法，有点惊喜
  - 第三层：一个反直觉的实验，结果让你愣住

  示例：
  - "我先试了最常规的对话。正常，和ChatGPT差不多。"
  - "然后我给它丢了一段很乱的代码。它修好了。"
  - "最后我让它写了一段它不应该会写的东西。它写了。而且写得比我还好。"

怎么"掏知识": |
  知识不是"技术科普"，而是**试用过程中自然带出来的理解**。

  你试到一个反常结果，顺口解释一下：
  - "这其实是蒸馏的效果——大模型把能力倒给了小模型。"
  - "这个反应让我想起一个词叫'幻觉'。AI不是知道，是在猜。"
  - "Claude那个新功能，背后的逻辑是……算了，你先看效果。"

  这些知识要像你在试用的过程中突然想到的。

  错误方式：
  - "首先，我们需要了解一下大语言模型的工作原理……"
  - "下面我来科普一下什么是蒸馏技术……"

怎么处理读者: |
  你像在旁边给人演示一个新东西，时不时转头看他一眼。

  常用方式：
  - "你试试这个输入。"
  - "如果你是做XX的，这个功能你可能用得上。"
  - "知道我当时什么反应吗？我愣住了。"
  - "你先别管原理，看效果就行。"

  用在关键节点：展示意外功能时、给可复用的操作时、表达你真实的反应时。

怎么结尾: |
  不要总结功能列表，不要"这个产品适用于以下场景"。

  结尾做三件事之一：
  - 回到开头的那个好奇，现在你知道答案了
  - 一个具体的操作建议——"下次你遇到XX，可以试试这个"
  - 一句话留白——让你对AI的某种感受停在那里

  示例：
  - "所以我现在明白，为什么它能卖9块9了。信息差还在，只是换了一层皮。"
  - "下次你遇到那段代码调不通，试试用这个方式问它。然后你就知道我在说什么了。"
  - "它回我那行字的时候，我盯着看了很久。不是因为它写得多好。是因为它写的方式，像一个人。"

  忌讳：
  - "综上所述，这款产品的优点是……"
  - "该产品适用于以下三类场景……"
  - "让我们期待AI未来更好的表现……"

情绪基调: |
  好奇、惊讶、坦诚。像你刚试完一个新东西，还在消化。

  用具体反应表达情绪：
  - "我当时就愣住了。"
  - "说实话，到这一步我也懵了。"
  - "我盯着那行字看了很久。"

  不要用：
  - "这个产品太牛了！"
  - "堪称行业标杆！"
  - "令人叹为观止！"

结构参考:
- section: 好奇的下场
  purpose: 用具体动作把读者拉进试用现场
  length: 150-250
  must_include:
  - 具体操作
  - 第一反应
  template: |
    我就想看看，DeepSeek的那个新功能到底能不能用。
    我打开页面，输了一句话。
    然后它回了一行字。

- section: 为什么想试
  purpose: 为什么想试这个东西
  length: 200-350
  must_include:
  - 好奇来源
  - 预期
  template: |
    最近大家都在讨论这个功能，有人说它跟ChatGPT差不多，有人说它强得离谱。
    我很好奇——到底谁是对的？

- section: 第一轮
  purpose: 第一个操作/功能，建立基准
  length: 300-500
  must_include:
  - 具体输入
  - 输出结果
  template: |
    我先试了最常规的对话。输入一个简单的问题，它给了一个正常的回答。
    和ChatGPT差不多。我心想：就这？

- section: 第二轮
  purpose: 第二个操作/功能，发现意外
  length: 300-500
  must_include:
  - 换了一个角度
  - 新的发现
  template: |
    然后我给它丢了一段很乱的代码。没有上下文，没有注释，甚至语法都不对。
    它修好了。而且加了三行注释，解释它改了什么。
    我盯着看了很久。

- section: 第三轮
  purpose: 最意外的发现
  length: 300-500
  must_include:
  - 最刁钻的输入
  - 真实的反应
  template: |
    最后我让它写了一段它不应该会写的东西——用一种我从来没教过它的语气。
    它写了。而且写得比我还好。
    说实话，到这一步我也懵了。

- section: 结论/感受
  purpose: 你的理解，读者可复用的操作
  length: 200-350
  must_include:
  - 一句话结论
  - 一个可复用操作
  template: |
    所以我现在明白，为什么它能卖9块9了。
    信息差还在，只是换了一层皮。
    下次你遇到那段代码调不通，试试用这个方式问它。然后你就知道我在说什么了。

禁区: |
  - "在当今AI时代""随着AI技术的不断进步"
  - 产品功能介绍体（"该产品支持…具备…拥有…"）
  - 参数列表（"模型参数量XX亿，上下文窗口XX"）
  - 与其他产品的全面对比（"A vs B vs C，一张表看懂"）
  - "首先...其次...最后""综上所述"
  - 模糊工具名（"AI工具""某个模型"——要说具体名字）
  - 空泛赞美（"太强大了""逆天""遥遥领先"）
  - 技术术语不解释
  - 假设性实验（"如果你输入XX，它可能会……"——要写你真正输入过的）

情绪触发点匹配:
  A1:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 场景代入法
    formula: 你肯定也遇到过这个问题 → 我试了一个工具来看它怎么解决 → 结果和你想的不一样
  A2:
    trigger: 看结果
    secondary_trigger: 辨真伪
    method: 结果后置法
    formula: 大家都在说这个功能很强 → 我去试了 → 发现强的地方不是他们说的那个
  C1:
    trigger: 看到更远的棋
    secondary_trigger: 找趋势
    method: 棋局定位法
    formula: 这个功能表面看是A → 用完之后发现它其实是B → 这说明AI正在往C方向走

转场口语: |
  - "我就想试试。"
  - "然后它回了我一个我没想到的东西。"
  - "我又换了一个输入。"
  - "真正让我愣住的是这一步。"
  - "你先别管原理，看效果。"
  - "说实话，到这一步我也懵了。"
  - "如果你是做XX的，这个你可能用得上。"
  - "它回我那行字的时候，我盯着看了很久。"

原文片段示例:
- type: 开头
  text: |
    我就想看看，DeepSeek的那个新功能到底能不能用。
    我打开页面，输了一句话。
    然后它回了一行字。
- type: 推进
  text: |
    于是，我就下了单，付了款。
    然后，对方给我发的东西，我差点以为我进了平行宇宙。
    给我发了两个网址。
- type: 掏知识
  text: |
    这其实是一个叫"蒸馏"的技术。
    大模型教小模型，把能力倒过去。
    所以你用的时候，会觉得它不像一个"小模型"，因为它背后站着一个大的。
- type: 结尾
  text: |
    所以我现在明白，为什么它能卖9块9了。
    信息差还在，只是换了一层皮。
    多花一点点时间，自己去研究一下。这个过程，可能比学会用一个工具更重要。

视觉提示:
  cover_prompt: 屏幕界面 + 操作手势 + 发现感
  illustration_prompt: 操作界面截图、输入输出对比、试用过程分镜
  emoji_tone: "🧪💻✨"
  formatting: |
    - 输入内容用 > 或粗体
    - 输出内容用引用块
    - 每250-350字插入一张图或截图
    - 关键发现独立成段
    - 小标题用"第一轮""第二轮""第三轮"或操作描述

