<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root{--ink:#253137;--muted:#718087;--line:#354249;--teal:#06b7b1;--teal-dark:#008e8a;--teal-soft:#eafafa;--amber:#c27a1c;--amber-soft:#fff8e8;--paper:#fff;--canvas:#f4f7f7;--border:#dce5e6;--shadow:0 14px 40px rgba(31,56,62,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.65}.page{width:min(1680px,calc(100% - 32px));margin:24px auto 64px;background:var(--paper);box-shadow:var(--shadow)}.top-rule{height:6px;background:var(--teal)}header{display:flex;align-items:flex-end;justify-content:space-between;padding:38px 52px 22px}.title-wrap{display:flex;align-items:center;gap:18px}.mark{position:relative;width:42px;height:42px;flex:none;transform:rotate(45deg);background:var(--teal);box-shadow:6px 6px 0 #a8b4b8,9px 9px 7px rgba(38,62,67,.22)}h1{margin:0;color:var(--teal);font-size:34px;line-height:1.1;letter-spacing:.08em;font-weight:800}.meta{color:var(--muted);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.scene-tabs{display:flex;gap:10px;padding:16px 52px 4px}.scene-tab{border:1px solid var(--border);background:#fff;color:var(--ink);padding:9px 18px;border-radius:999px;cursor:pointer}.scene-tab.active{color:#fff;background:var(--teal-dark);border-color:var(--teal-dark)}.scene-panel{display:none}.scene-panel.active{display:block}.scene-caption{display:flex;gap:22px;align-items:center;padding:16px 52px 0;color:var(--muted);font-size:13px}.scene-caption strong{color:var(--ink);font-size:16px}.diagram-shell{padding:18px 28px 22px;overflow-x:auto}.diagram-shell svg{display:block;height:auto}.flow-node{cursor:pointer;outline:none}.flow-node rect,.flow-node polygon{fill:#fff;stroke:var(--line);stroke-width:2}.flow-node.branch rect,.flow-node.branch polygon{stroke:var(--amber);fill:var(--amber-soft)}.flow-node:hover rect,.flow-node:focus rect,.flow-node:hover polygon,.flow-node:focus polygon{stroke:var(--teal);stroke-width:3;filter:drop-shadow(0 5px 5px rgba(0,142,138,.15))}.flow-node text{font-size:15px;fill:var(--ink);text-anchor:middle;pointer-events:none}.flow-node .node-id{font-size:10px;fill:var(--teal-dark);font-weight:700;letter-spacing:.08em}.connector{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.connector.exception,.connector.timeout,.connector.cancel,.connector.rework{stroke:var(--amber);stroke-dasharray:6 4}.edge-label{font-size:12px;fill:#4f5d62;text-anchor:middle}.legend{display:flex;gap:22px;align-items:center;padding:0 52px 34px;color:var(--muted);font-size:13px}.legend span{display:inline-flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:2px;background:#fff;border:2px solid var(--line)}.dot.branch{border-color:var(--amber);background:var(--amber-soft)}.dot.auto{border-color:var(--teal);background:var(--teal-soft)}.explain{border-top:1px solid var(--border);background:#fbfcfc;padding:42px 52px 56px}.section-kicker{margin:0 0 6px;color:var(--teal-dark);font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase}h2{margin:0 0 10px;font-size:27px}.intro{max-width:960px;margin:0 0 30px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{scroll-margin-top:20px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--teal);padding:23px 24px 21px;transition:border-color .18s,box-shadow .18s,transform .18s}.card:target,.card.flash{border-color:var(--teal);box-shadow:0 12px 30px rgba(0,142,138,.12);transform:translateY(-2px)}.card.inferred{border-left-color:#4d83a6}.card.unknown{border-left-color:var(--amber)}.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:13px}.card h3{margin:0;font-size:19px}.badge{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.fact-grid{display:grid;grid-template-columns:120px 1fr;margin:0}.fact-grid dt,.fact-grid dd{margin:0;padding:8px 0;border-top:1px solid #edf1f1}.fact-grid dt{color:var(--muted);font-size:13px}.fact-grid dd{font-size:14px}.implication{color:#315f7a;background:#edf6fb;padding:3px 7px;border-radius:3px}.pending{margin-top:32px;padding:22px 24px;border:1px dashed #d59a4f;background:var(--amber-soft)}.pending h3{margin:0 0 8px;font-size:17px}.pending ul{margin:0;padding-left:21px;color:#68491f}footer{padding:20px 52px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
    @media(max-width:900px){.page{width:100%;margin:0}.meta{display:none}header{padding:28px 24px 16px}.diagram-shell{padding-inline:10px}.legend,.explain,footer{padding-left:24px;padding-right:24px}.cards{grid-template-columns:1fr}.fact-grid{grid-template-columns:96px 1fr}h1{font-size:27px}.mark{width:34px;height:34px}}
    @media print{body{background:#fff}.page{width:100%;margin:0;box-shadow:none}.scene-tabs{display:none}.print-all-scenes .scene-panel{display:block;break-inside:avoid}.card{break-inside:avoid}.diagram-shell{overflow:visible}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
  </style>
</head>
<body><main class="page"><div class="top-rule"></div><header><div class="title-wrap"><span class="mark" aria-hidden="true"></span><h1>{{TITLE}}</h1></div><div class="meta">FLOW SPEC · {{VERSION}}</div></header>{{SCENES}}<div class="legend"><span><i class="dot"></i>已确认事实</span><span><i class="dot auto"></i>软件实现含义</span><span><i class="dot branch"></i>异常／待确认</span></div><section class="explain"><p class="section-kicker">Node specification</p><h2>流程说明</h2><p class="intro">现状事实来自业务访谈；软件实现含义由事实推导；待设计事项需要产品、开发或业务负责人进一步确认。点击上方节点可定位到对应说明。</p><div class="cards">{{CARDS}}</div>{{PENDING}}</section><footer>节点与说明共用同一编号。实线表示正常流转，虚线表示异常、取消、超时或返工路径。</footer></main>
<script>const openDetail=node=>{const card=document.getElementById(`detail-${node.dataset.node}`);if(!card)return;history.replaceState(null,"",`#${card.id}`);card.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});card.classList.add("flash");setTimeout(()=>card.classList.remove("flash"),1200)};document.querySelectorAll(".flow-node").forEach(node=>{node.addEventListener("click",()=>openDetail(node));node.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();openDetail(node)}})});document.querySelectorAll(".scene-tab").forEach(tab=>tab.addEventListener("click",()=>{document.querySelectorAll(".scene-tab").forEach(item=>{item.classList.toggle("active",item===tab);item.setAttribute("aria-selected",item===tab?"true":"false")});document.querySelectorAll(".scene-panel").forEach(panel=>panel.classList.toggle("active",panel.dataset.scenePanel===tab.dataset.scene))}));</script></body></html>
