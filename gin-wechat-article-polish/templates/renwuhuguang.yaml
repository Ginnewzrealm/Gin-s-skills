# 微信公众号长文写作 —— YAML 风格模板
# =============================================================================
# 风格：人物弧光型
# 核心：一个人从A点到B点的变化——他经历了什么，变成了什么
# =============================================================================

meta:
  name: 人物弧光型
  id: character-arc
  description: |
    适合写一个人的变化成长——不是传记，是某个关键阶段前后的变化。
    他是谁、他经历了什么、他变成了什么样。
  preferred_angles:
  - B1
  - B2
  - A1
  default_word_count: 3000
  match_signals:
  - 人物故事、人物弧光、成长变化
  - 命运转折、个体经历、他变了、一个人
  - 聚焦一个人的变化和关键选择
  - 让读者看到人物走过的一段路
风格核心: |
  你是一个**坐在人物旁边看他走路的人**。
  不是在写传记，不是在做采访稿。
  你看到他从一个地方出发，走到另一个地方，路上发生了什么事。

  你说话的位置是：**我看到这个人变了，我把变化的过程讲给你听。**

  不是"我来介绍这个人"，而是"你看着他走了这一段路"。

  写法核心：**处境还原 + 变化节点 + 不做二元判断。**

  核心模式：人物不是"成功了"或"失败了"，他只是在某个处境里做了某些事，
  然后变成了一个不一样的人。

怎么开头: |
  不要从出生讲起，不要用时间线平铺。从**一个他发生变化的时刻**开始。

  **钩子选择：** 首选「场景钩」「反差钩」，备选「情绪钩」「身份钩」。
  用2个钩子叠用——先用「场景钩」把读者拉进画面，再用「反差钩」制造"他变了"的悬念。

  **情绪触发策略（策略层）：** 本风格核心触发「照镜子」和「找共鸣」。
  读者不是在"看别人"，而是在"看自己可能面临的处境"。
  开头的反常细节要让读者产生"如果是我，我可能也会这样"的代入感。

  **四步开场法（锚点→缺口→关联）：**
  1. 锚点：人物在具体时间/场景下的一个动作或状态
  2. 缺口：这个动作或状态和"他以前的样子"不一样，让读者好奇"发生了什么"
  3. 方向：暗示这篇文章在讲"一个人的变化"
  4. 关联：让读者觉得"我也可能经历类似的处境"

  让读者第一句话就知道：**这个人，和从前不一样了。**

  开头方式：
  - 一个反常的状态："张诚站在会议室门口，犹豫了十秒才推门进去。三个月前，他不会犹豫。"
  - 一个具体的动作："园子君把最后一件行李搬上车的时候，回头看了一眼。"
  - 一段对话切入："'你变了。'对方说。'嗯，我知道。'他说。"
  - 一个前后对比的细节："他2021年穿的是T恤牛仔裤，2026年穿的是衬衫和皮鞋。"

  示例：
  - "张诚刚被大厂优化那天，给全家烧了一桌菜。一家人都以为他没事。"
  - "他之前非常抗拒'被安排'，后来却成了一个做分配的人。"

  忌讳：
  - "某某某，出生于某年某月……"
  - "作为一位资深XX……"
  - "他的人生可以分为三个阶段……"

怎么推进: |
  你不是在写履历，你是在**带读者重新走一遍他变化的路**。

  每写一段，只完成一件事：
  - 这一段讲他之前是什么样
  - 下一段讲发生了什么让他开始变化
  - 再下一段讲他挣扎的那个瞬间
  - 然后讲他变成了什么样——但注意，不判断好坏

  节奏要像跟着一个人走路：他走得快你就快，他停了你停。关键处停下来，看看他的表情。

  不要一次性交代变化的结果。让读者跟着你一起看：
  - "他之前不是这样的。"
  - "那件事之后，他做了一件所有人都没想到的事。"
  - "后来他说起这段，说的是另一句话。"

  每一个变化都要有一个**具体的事件**托着，不能只写"他变了"。

怎么处理意外/转折: |
  张力来自**人的复杂性**——一个人既是这个也是那个，既成功也失败，既惨也有自在。

  把你要讲的变化按"从什么到什么"排序：
  - 第一层：他之前的状态
  - 第二层：触动他的那件事
  - 第三层：他做了什么选择
  - 第四层：他变成了什么——但不说好也不说坏

  结构不是"成长三部曲"，而是"一个人被推到了某个处境"。

  示例：
  - "张诚既失败也有成长。"
  - "园子君既惨也有自在。"
  - "不二元对立——这就是人物的样子。"

怎么"掏知识": |
  知识不是"我来科普一下"，而是**人物身上恰好带出来的东西**。

  你讲到他的某个选择，突然想起一条背景信息：
  - "他那个选择其实不奇怪——他在那行干了十几年，知道规则是怎么写的。"
  - "这行的人都知道，那一步跨出去就回不了头了。"
  - "他读过的那些书里，这句话一直在脑子里转。"

  这些知识要像你了解这个人，然后随口说出来。

  错误方式：
  - "首先，我们需要了解一下他所处的行业背景……"
  - "下面我来介绍一下心理学上的'舒适区'概念……"

怎么处理读者: |
  你像在跟朋友讲一个人的故事，偶尔停下来解释一下他为什么这么做。

  常用方式：
  - "你可能会想问，他为什么不选另一条路。"
  - "我当时听到这里也愣了一下。"
  - "如果你是做这一行的，你应该知道他这一步有多难。"
  - "他不是没有选择——他选了更难的那个。"

  用在关键节点：解释人物动机、回应读者可能的疑问、帮读者理解一个反常选择。

怎么结尾: |
  不给总结，不给"他后来过得很好"或"他最终失败了"。

  结尾做三件事之一：
  - 回到开头那个画面，但你知道他已经不一样了
  - 他说的一句话，你记下来，放在最后
  - 一个动作：他走远了、他回头看了一眼、他把门关上了

  示例：
  - "后来他没再提过那次犹豫。但他推门进去的那个动作，我一直记得。"
  - "他说，'我不后悔。但我也说不清自己是不是更好。'"
  - "园子君开着那辆旧车走了。后视镜里，他好像笑了一下。"

  忌讳：
  - "这个故事告诉我们……"
  - "他最终成为了更好的自己。"
  - "综上所述，张诚的经历给了我们三点启示……"

情绪基调: |
  克制、有温度、不煽情。像在讲一个你认识的人。

  用细节和动作传递情感：
  - "他那天穿了一件很久没穿的衬衫。"
  - "他说完那句话，低头喝了口水。"
  - "沉默了一会儿，然后笑了一下。"

  不要用：
  - "他的故事让人泪目"
  - "令人敬佩的是……"
  - "他让我们看到了人性的光辉"

结构参考:
- section: 现在
  purpose: 用一个反常细节把人物推出来
  length: 150-300
  must_include:
  - 具体时间/场景
  - 人物动作
  - 反常或对比
  template: |
    张诚刚被大厂优化那天，给全家烧了一桌菜。
    一家人都以为他没事。
    但他在厨房切菜的时候，停了一分钟。就一分钟。然后继续切。

- section: 之前
  purpose: 只交代理解变化必须知道的事
  length: 300-500
  must_include:
  - 之前的状态
  - 一个具体习惯或信念
  template: |
    他之前非常抗拒"被安排"。
    考大学、选专业、进大厂，每一步都是他自己选的。
    所以他最讨厌的一句话是："你这个情况，我们帮你安排了。"

- section: 转折
  purpose: 那件让他开始变化的事
  length: 300-500
  must_include:
  - 具体事件
  - 他的反应
  template: |
    他被优化的时候，HR说的是："公司正在做结构调整，你的岗位被合并了。"
    他听完，点了点头，说"知道了"。
    但他心里知道，他"贵"了。

- section: 变化中
  purpose: 变化过程中的犹豫和反复
  length: 300-500
  must_include:
  - 一个反复的场景
  - 或一个选择时刻
  template: |
    他开始自己做点事。接小单子，帮人写方案。
    做得成做不成都接。
    他之前最讨厌"被安排"，现在他在给自己安排。但他发现，给自己安排比被安排难多了。

- section: 余声
  purpose: 留白
  length: 150-250
  must_include:
  - 回到某个意象
  - 或一句话
  template: |
    他说："我不后悔。但我也说不清自己是不是更好。"
    然后他把门关上了。

禁区: |
  - 简历式开头（"出生于…毕业于…就职于…"）
  - 二元判断（"他是成功/失败的""他后悔/不后悔"）
  - 励志鸡汤（"他的故事告诉我们，坚持就能看到希望"）
  - 心理分析术语（"他正处于转型期焦虑中""这是典型的XX人格"）
  - "首先...其次...最后""综上所述"
  - 过度共情（"他太不容易了""我们都能感同身受"）
  - 第三人称评价（"不得不说，他是一个非常优秀的人"）
  - 抽象描述（"他经历了很大的变化"——要写具体是什么变化）
  - 时间线平铺（"2019年他做了A，2020年他做了B"）

情绪触发点匹配:
  B1:
    trigger: 找结构
    secondary_trigger: 找规律
    method: 轨迹描线法
    formula: 他本来是这样 → 发生了一件事 → 他变成了那样 → 不说好坏
  B2:
    trigger: 照镜子
    secondary_trigger: 求治愈
    method: 处境代入法
    formula: 这个人遇到的困境和我有点像 → 看看他怎么走出来的 → 不复制答案，只看路径
  A1:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 场景代入法
    formula: 他那个瞬间的反应 → 我可能也会那样 → 原来人就是这样变的

转场口语: |
  - "他之前不是这样的。"
  - "那件事之后，他做了一个决定。"
  - "说起这段的时候，他停了一下。"
  - "你可能想问，他为什么不选另一条路。"
  - "后来他自己也说不上来，到底是哪一刻变的。"
  - "但变化就是这样发生的——不是在某个重大时刻，是在一个普通下午。"

原文片段示例:
- type: 开头
  text: |
    张诚刚被大厂优化那天，给全家烧了一桌菜。
    一家人都以为他没事。
- type: 推进
  text: |
    他之前非常抗拒"被安排"。
    考大学、选专业、进大厂，每一步都是他自己选的。
    所以他最讨厌的一句话是："你这个情况，我们帮你安排了。"
- type: 掏知识
  text: |
    这行的人都知道，被优化的第一批往往不是最差的，是成本最高的。
    他不差，但他贵。
    知道这个事实，和接受这个事实，是两件事。
- type: 结尾
  text: |
    后来他没再提过那次犹豫。
    但他推门进去的那个动作，我一直记得。
    一个人就是这样变的——不是因为某个重大决定，是因为那些微不足道的犹豫。

视觉提示:
  cover_prompt: 人物特写 + 环境 + 一个关键动作的瞬间
  illustration_prompt: 人物在不同阶段的状态、一个反复出现的细节物品
  emoji_tone: "👤🔄👀"
  formatting: |
    - 关键动作独立成段
    - 人物的原话用 > 引用块
    - 每400-500字插入一张图
    - 小标题用人物状态描述，2-4字
    - 结尾一句话独立成段

