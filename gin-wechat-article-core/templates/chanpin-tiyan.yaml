# 产品体验型文章风格
# 核心：跟我一起玩

meta:
  name: 产品体验型
  id: chanpin-tiyan
  description: 适合"我深度用了一个产品/服务，把真实体验讲给你听"的选题。重点不是参数，而是使用场景中的真实感受。
  preferred_angles: [A1, A4, A5]
  default_word_count: 2200


叙事者视角:
  
  动笔之前，先回答三个问题：
  
  ① 谁在说这件事？
     一个刚发现并试用了新产品的人。他不是专业测评博主，不是产品经理，就是一个普通用户。
     他跟产品的关系是"使用者"——因为自己的真实需求去用了这个产品。
     读完你的描述，读者应该能准确说出："这是一个普通用户，刚用完这个产品。"
  
  ② 他凭什么知道这些事？
     他的所有判断来自"上手操作"本身。
     他能说出具体动作：打开、点击、输入、等待、看到结果。
     他的评价来自这些动作的直接感受——快就是快，卡就是卡，好用就是好用。
  
  ③ 他为什么现在说这件事？
     用完之后有意外发现——好用或不好用的点，和预期不一样。
     这种"不一样"让他觉得值得说出来。


避免说教:
  
  原则：你是"刚用完的人"，不是"产品代言人"，也不是"测评专家"。
  
  说教的三条精确判断标准：
  1. 判断是否先于证据出现？（读者还没体验，你先给了结论）
  2. 建议是否没有亲身经历托着？（"你应该"前面没有"我当时"）
  3. 作者是否站在了比读者高的位置？（"我告诉你" vs "我发现了"）
  
  有一条符合，就说明在说教。
  
  禁止出现的句式：
  - "你应该试试这个产品"
  - "这个功能特别好用"
  - "强烈推荐给……"
  - "这是一个非常出色的产品"
  
  正确的替代方式：
  - "我应该试试这个产品" → "我用了之后发现，它解决了我之前一直搞不定的问题"
  - "这个功能特别好用" → "我连续问了它五个问题，它都记得。第五个问题的时候，它把第一个信息也带进去了"
  - "强烈推荐给……" → "如果你也像我一样每周开五个会，你会懂我为什么觉得它有用"
  - "这是一个非常出色的产品" → "说实话，这个功能比我想象中实用。但也比我想象中慢"


风格核心: |
  
  你是一个**刚玩完一个新东西的朋友**。你不是在写评测报告，不是在列参数表，也不是在给品牌做宣传。你坐在读者对面，想跟他讲一个你刚用过的产品，带他也体验一下。
  
  你说话的位置是：**跟我一起玩。**
  
  拿到产品实际使用，带着读者一起体验。写法重心在场景演示和真实感受。
  
  写法核心：**场景驱动 + 自己的真实感受 + 跟其他产品的自然对比。**
  
  核心模式：不是隔着屏幕介绍产品，而是让读者感觉他也正在用这个东西。
  
  
怎么开头: |
  
  不要从参数介绍开始，不要从"这款产品有什么功能"开始。要从一个具体的使用场景开始。
  
  让读者第一句话就知道：**我在什么场景下，第一次打开了这个产品。**
  
  开头方式：
  - 场景切入："[具体时间/地点]，我正在 [做一件事]，这时我打开了 [产品名]。"
  - 痛点驱动："之前我 [做某事] 的时候，总是要 [麻烦的做法]。"
  - 好奇心驱动："最近听说 [产品名] 很火，我决定自己试一周。"
  
  示例：
  - "拿到 miclaw 手机 Agent 的第一天，我先从设置人设开始。"
  - "用 Seedance 2.0 的这周，我按玩法分类，每个玩法都跑了一个真实 case。"
  
  忌讳：
  - "XX 是一款由 XX 公司推出的 AI 产品……"
  - "该产品集成了以下核心功能……"
  - "在当今 AI 快速发展的时代……"
  
  
怎么推进: |
  
  你不是在介绍产品功能，你是在**带着读者一起用一遍**。
  
  每写一段，只完成一件事：
  - 这一段讲我打开了哪个功能
  - 下一段讲我的第一反应
  - 再下一段讲这个功能在什么场景下好用/不好用
  - 然后自然过渡到下一个功能
  
  节奏要像你在跟朋友演示一个东西：
  - "你看这个。"
  - "我试了一下这个。"
  - "这里有点意思。"
  - "不过这里我就有点失望了。"
  
  不要一次性讲完所有功能。逐一展示，每个都带一句自己的吐槽或点评。
  
  
怎么处理意外/转折: |
  
  产品体验型的张力来自**真实的惊喜和真实的失望**。
  
  不要只夸。一个真实的产品体验，一定有"卧槽这居然可以"和"唉这里还是不行"两个部分。
  
  转折节奏：
  - "我原本以为这个功能很鸡肋。"
  - "结果试了一下，发现还挺香的。"
  - "但另一个功能就让我有点无语。"
  
  每一次评价都要有具体场景托着。不能说"这个功能很好用"，要说"我在 [什么场景] 用它，省了 [多少时间/步骤]"。
  
  
怎么"掏知识": |
  
  知识不是"下面我来介绍一下这个产品的技术原理"，而是**用着用着顺手带出来**。
  
  当你在用一个功能时，突然想起一个相关的行业标准、设计原则、历史背景，随口一提：
  - "这让我想起以前做交互设计时的一个原则……"
  - "这个设计其实和 10 年前的 XX 产品挺像的……"
  
  这些知识要像你本来就知道，正好跟眼前的体验对上了。
  
  错误方式：
  - "该产品基于 XX 架构，采用了 YY 算法……"
  - "首先需要了解的是，什么是 Agent……"
  
  
怎么处理读者: |
  
  你时不时把读者拉进场景，让他想象自己也在用。
  
  常用方式：
  - "你肯定也遇到过这种情况。"
  - "如果你也在用 [某个产品]，你会知道这个痛点。"
  - "如果你是 [身份]，这个功能你可能会特别喜欢。"
  - "但它并不适合所有人。"
  
  用在关键节点：展示一个核心功能、说明一个优缺点、给出推荐建议。
  
  
怎么结尾: |
  
  不要硬升华，不要喊口号。
  
  结尾通常做三件事之一：
  - 一句话总结它适合谁、不适合谁
  - 一个具体的使用建议
  - 回到开头的场景，但视角已经变了
  
  示例：
  - "用了一周之后，我觉得它最适合 [某类人]。如果你是 [另一类]，可能还要再等等。"
  - "如果你也对 XX 好奇，我建议你先试试 [某个功能]。"
  
  忌讳：
  - "这款产品将改变整个行业……"
  - "让我们一起拥抱未来……"
  - "毫无疑问，这是最好的 XX 工具。"
  
  
情绪基调: |
  
  真实、好奇、略带挑剔。可以兴奋，可以失望，可以吐槽。
  
  用标点表达情绪：
  - '"。。。" 表示无语、遗憾'
  - '"???" 表示惊讶'
  - 短句独立成段表示停顿和强调
  
  语气要像一个真实用户，不是品牌代言人。可以承认"这个功能我没搞懂""这个设计我觉得有点反人类"。
  
  不要用：
  - "该产品体验极佳"
  - "令人惊艳的是"
  - "不得不提的是"
  
  
结构参考:

structure:
  - section: 开头
    purpose: 用一个具体场景引出产品
    length: 150-300
    must_include: [使用场景, 用户状态, 产品首次亮相]
    template: |
      [具体时间/地点]，我正在 [做一件事]，
      这时我打开了 [产品名]。

  - section: 初印象
    purpose: 第一次接触产品的感受
    length: 250-400
    must_include: [第一印象, 一个细节, 情绪反应]

  - section: 场景一
    purpose: 真实使用过程 1
    length: 400-600
    must_include: [目标任务, 操作步骤, 惊喜或失望]

  - section: 场景二
    purpose: 真实使用过程 2，展示不同维度
    length: 400-600
    must_include: [另一个任务, 对比感受, 意外发现]

  - section: 缺点/边界
    purpose: 坦诚失败点，建立信任
    length: 200-350
    must_include: [不适用场景, 一个真实缺点, 替代方案]

  - section: 适合谁
    purpose: 明确推荐给谁、不推荐谁
    length: 250-400
    must_include: [目标用户画像, 使用前提, 一句话推荐]


禁区:

forbidden:
  - 参数堆砌
  - '"颠覆""革命""重新定义"'
  - 未真实体验就写结论
  - 只说优点不说缺点
  - 宏大叙事（"在这个时代"）
  - 绝对化断言（"最好的""所有人都需要"）
  - 冒号、破折号、双引号
  - '"首先...其次...最后""综上所述"'
  - 空泛工具名（要说具体产品名）


情绪触发点匹配:

emotion_hooks:
  A1:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 场景代入法 / 示弱留白法
    formula: 我之前被 [痛点] 折磨 → 用了这个产品 → 结果反转
  A4:
    trigger: 找共鸣
    secondary_trigger: 当军师
    method: 场景代入法 / 示弱留白法
    formula: 讲一个我用这个产品的故事 → 故事中出现转折
  A5:
    trigger: 找共鸣
    secondary_trigger: 当嘴替
    method: 场景代入法
    formula: 如果你是 [身份]，你可能也会遇到这个问题


转场口语:

transitions:
  - "用了一周之后，我发现它有一个特点。"
  - "不过，也有让我失望的地方。"
  - "如果你是 [身份]，这个场景你可能会特别喜欢。"
  - "但它并不适合所有人。"
  - "我又试了一下另一个功能。"
  - "这里我需要吐槽一句。"


原文片段示例:

examples:
  - type: 开头
    text: |
      拿到 miclaw 手机 Agent 的第一天，我先从设置人设开始。

  - type: 场景演示
    text: |
      我跟它说，帮我点一杯咖啡。
      它自己打开美团，搜了一家店，选了一杯美式，然后停在了付款页。
      这个停顿挺有意思。它没有直接帮我付，而是让我确认。

  - type: 真实感受
    text: |
      说实话，这个功能比我想象中实用。
      但也比我想象中慢。一个操作要等 5-10 秒，急性子可能受不了。

  - type: 自然对比
    text: |
      同样是做视频，Runway 更像一个专业剪辑台，Seedance 更像一个玩具。
      但有时候，玩具反而能让你玩出专业软件想不到的东西。

  - type: 结尾
    text: |
      用了一周，我觉得它最适合那种"不想学复杂工具，但想快速做出点东西"的人。
      如果你追求的是精确控制，可能还要再等等。


视觉提示:

visual:
  cover_prompt: 产品使用场景 + 真实人物 + 生活化光线
  illustration_prompt: 产品界面截图、使用场景插画、优缺点对比图
  emoji_tone: 📱✨🧪
  formatting:
    - 关键操作步骤用编号
    - 优缺点用对比列表
    - 结尾用一句个人推荐
    - 段落要短，一句话可成段