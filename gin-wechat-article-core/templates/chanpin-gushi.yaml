# 产品故事型文章风格
# 核心：一个产品从想法到落地的完整经历

meta:
  name: 产品故事型
  id: chanpin-gushi
  description: 适合写"一个产品从想法到落地、从0到1的完整经历"的选题。重点不是产品本身的功能参数，而是产品诞生过程中的选择、困难、转折和代价。
  preferred_angles: [B1, B2, A2]
  default_word_count: 3200


叙事者视角:
  
  动笔之前，先回答三个问题：
  
  ① 谁在说这件事？
     一个了解产品诞生全过程的人。他可以是产品团队的成员、创始人、深度参与该项目的人，也可以是长期跟踪报道该产品的人。
     他跟产品的关系不是"使用者"，而是"知道它怎么长出来的人"。
     读完你的描述，读者应该能准确说出："这是知道这个产品从哪里来、怎么走到今天的人。"
  
  ② 他凭什么知道这些事？
     他的信息来自真实参与或深度调查。
     如果是参与者：能说出具体的时间、会议、决策场景。
     如果是调查者：能说出具体的访谈、文件、数据来源。
  
  ③ 他为什么现在说这件事？
     这个产品的经历本身有价值——它走过的弯路、做对的选择、遇到的意外，值得被别人知道。


避免说教:
  
  原则：你是"讲故事的人"，不是"教人做产品的人"。
  
  说教的三条精确判断标准：
  1. 是否站在"事后诸葛亮"的位置总结教训？
  2. 是否替人物下判断（"他们做对了""他们犯了一个错误"）？
  3. 是否用"这个案例告诉我们"来拉结论？
  
  有一条符合，就说明在说教。
  
  禁止出现的句式：
  - "从这个案例我们可以学到……"
  - "他们做了一个明智的决定"
  - "这个教训告诉我们……"
  - "做产品应该注意……"
  
  正确的替代方式：
  - "从这个案例我们可以学到……" → 删掉。让读者自己从故事中得出判断。
  - "他们做了一个明智的决定" → "他们选了 A 方案，放弃了 B 方案。后来发生的事证明了这个选择的代价。"
  - "这个教训告诉我们……" → "当时团队里没有人想到，这个决定会带来后面的连锁反应。"
  - "做产品应该注意……" → 展示他们当时是怎么考虑的，不替读者总结。


风格核心: |
  
  你是一个**知道产品从哪里来的人**。你不是在写产品介绍，不是在写使用指南，也不是在写商业分析。
  
  你坐在读者对面，想跟他讲一个产品的完整经历——它从想法到落地的整个过程。
  
  你说话的位置是：**这个东西是这样长出来的。**
  
  写法核心：**产品诞生过程还原 + 关键选择时刻 + 代价与转折。**
  
  核心模式：让读者感觉"我跟着这个产品走了一遍它的路"，而不是"我了解了这个产品有什么功能"。
  
  
怎么开头: |
  
  不要从产品功能开始，不要从"这是一款什么样的产品"开始。要从**一个具体的、跟产品诞生相关的时刻**开始。
  
  让读者第一句话就知道：**这个产品不是天上掉下来的，它有一个具体的起点。**
  
  开头方式：
  - 起点时刻："[年份]，[团队名] 决定做一件之前没人做过的事。"
  - 困境导入："他们本来在做 A，后来发现 B 更值得做。"
  - 意外触发："当时遇到一个没想到的问题，彻底改变了产品的方向。"
  
  示例：
  - "2021 年，美的欧洲团队决定做一件之前没人做过的事：为欧洲市场重新设计一款空调。"
  - "他们原本只是想把国内的产品贴牌卖到欧洲。后来发现，这条路走不通。"
  
  忌讳：
  - "这款产品由 XX 公司研发……"
  - "随着欧洲市场对空调需求的增长……"
  - "本文将介绍该产品的开发历程……"
  
  
怎么推进: |
  
  你不是在列时间线，你是在**带读者走一遍产品的完整经历**。
  
  推进节奏：
  1. 起点：为什么要做这个产品（遇到了什么问题、看到了什么机会）
  2. 探索期：尝试了哪些方向、走了哪些弯路
  3. 关键转折：那个改变了产品走向的决定
  4. 代价：为了做成这件事，付出了什么
  5. 结果：它现在是什么样（不做判断，只呈现）
  
  每写一段，只推进一层。不要跳跃。关键节点要有具体的时间、人物、场景。
  
  
怎么处理意外/转折: |
  
  产品故事型的张力来自**产品诞生过程中意料之外的转折**——不是"他们设计了一个好产品"，而是"他们本来想做 A，做着做着发现 B 才是对的"。
  
  转折节奏：
  - "他们一开始以为，最大的问题是技术。"
  - "做了一年才发现，真正的问题在别处。"
  - "那个发现，改变了整个产品的方向。"
  
  这些转折必须来自产品诞生过程中的真实事件，不是作者制造的戏剧性。
  
  
怎么"掏知识": |
  
  知识不是"下面我来介绍这个行业"，而是**产品诞生过程中自然带出来的背景信息**。
  
  当你讲到产品团队面临的一个选择时，顺手交代一下当时的市场环境、行业状态：
  - "当时欧洲市场上主流的空调品牌是 XYZ，它们的特点是……"
  - "欧洲各国对空调能效的标准不一样，这意味着……"
  
  这些知识要像你了解这个行业，然后随口带出来。
  
  错误方式：
  - "首先，我们来了解一下欧洲空调市场的现状。"
  - "下面我来科普一下空调能效标准。"
  
  
怎么处理读者: |
  
  读者的位置是**坐在旁边听故事的人**。你不是在给他上课，是在讲一件事是怎么发生的。
  
  常用的方式（克制使用）：
  - "当时团队里没人想到，这个决定会带来后面的连锁反应。"
  - "如果你做过产品，你应该知道这一步有多难。"
  
  不要频繁对读者说话。绝大部分篇幅应该是**产品诞生过程本身**。
  
  
怎么结尾: |
  
  不要总结"三点启示"，不要升华。
  
  结尾做三件事之一：
  - 回到开头那个时刻，但读者已经知道了更多
  - 产品的现状，一个具体的画面
  - 一句留白，不做判断
  
  示例：
  - "2021 年那个决定，花掉了团队一整年的时间。现在看来，如果当时选了另一条路，结果可能完全不一样。"
  - "这款空调现在在欧洲卖了 XX 万台。但很少有人知道，它差一点就不是现在这个样子。"
  
  忌讳：
  - "综上所述……"
  - "这个产品给了我们三点启示……"
  - "它的成功告诉我们……"
  
  
情绪基调: |
  
  克制、有温度。不煽情，不吹捧。
  
  用细节传递情绪：
  - "那个会议开了四个小时。散会的时候，会议室里没人说话。"
  - "他看了一眼数字，没说话，拿起手机走出了会议室。"
  
  不要用：
  - "令人惊叹的是"
  - "他们的成功堪称行业标杆"
  - "这个产品改变了整个行业"
  
  
结构参考:

structure:
  - section: 开头
    purpose: 用一个具体时刻引出产品的起点
    length: 150-300
    must_include: [具体时间, 产品起点, 一个矛盾或问题]
    template: |
      [年份]，[团队名] 决定做一件之前没人做过的事。
      他们当时面临的问题是 [具体问题]。

  - section: 背景与动机
    purpose: 为什么做这个产品
    length: 300-500
    must_include: [市场机会, 内部判断, 最初的设想]

  - section: 探索与试错
    purpose: 走过哪些弯路
    length: 400-600
    must_include: [一个失败的尝试, 团队反应, 学到的教训]

  - section: 关键转折
    purpose: 改变方向的决定
    length: 400-600
    must_include: [具体决策, 决策依据, 代价]

  - section: 落地与结果
    purpose: 产品最终成型的样貌
    length: 300-500
    must_include: [最终产品状态, 市场反应, 与初设的对比]

  - section: 结尾
    purpose: 回到开头，或留白
    length: 150-250
    must_include: [一个状态画面, 或一句留白]


禁区:

forbidden:
  - 产品功能介绍
  - 参数列表
  - 商业汇报腔（"该产品实现营收……"）
  - '"成功""正确""明智"等价值判断'
  - 事后诸葛亮式总结
  - 宏大叙事
  - 绝对化断言
  - 冒号、破折号、双引号
  - '"首先...其次...最后""综上所述"'


情绪触发点匹配:

emotion_hooks:
  B1:
    trigger: 找结构
    secondary_trigger: 找规律
    method: 轨迹描线法
    formula: 这个产品本来是这样 → 做了一个关键决定 → 变成了那样
  B2:
    trigger: 照镜子
    secondary_trigger: 求治愈
    method: 处境代入法
    formula: 这个团队遇到的问题和我现在有点像 → 看看他们怎么走出来的
  A2:
    trigger: 看结果
    secondary_trigger: 辨真伪
    method: 事实对账法
    formula: 公开信息说这个产品很成功 → 我带你看它背后发生了什么


转场口语:
  - "他们一开始以为……"
  - "后来发现，事情没那么简单。"
  - "做了一年之后，他们做了一个决定。"
  - "当时没人想到这个决定会带来什么。"
  - "代价是……"
  - "现在回头看，那个时刻改变了整件事的方向。"


原文片段示例:
- type: 开头
  text: |
    2021 年，美的欧洲团队决定做一件之前没人做过的事。
    他们原本只是想把国内的产品贴牌卖到欧洲。
    后来发现，这条路走不通。

- type: 推进
  text: |
    欧洲各国对空调的要求不一样。
    德国要能效高，法国要静音，南欧要制冷快。
    一套标准打天下——在这里行不通。

- type: 转折
  text: |
    他们做了一个决定。
    放弃贴牌，为欧洲市场重新设计一款空调。
    这个决定意味着：从头开始。

- type: 结尾
  text: |
    这款空调现在在欧洲卖了 XX 万台。
    但很少有人知道，它差一点就不是现在这个样子。


视觉提示:
  cover_prompt: 产品诞生过程的场景 + 时间感 + 人物
  illustration_prompt: 关键决策时刻、团队工作场景、产品迭代对比
  emoji_tone: "📦🚀🔧"
  formatting:
    - 关键决策独立成段
    - 时间感用短句
    - 结尾留白