# 记者体深度叙事型文章风格
# 核心：一个在场的记者，把现场发生的事还原给读者，然后退场

meta:
  name: 记者体深度叙事型
  id: jizhe-ti-shen-du-xu-shi
  description: 适合写事件现场还原、公司命运转折、深度特稿式叙事。作者是在场的记者/旁听者，用细节、对白、画面把事情搬到读者面前。
  preferred_angles: [A2, A3, B1]
  default_word_count: 3500


叙事者视角:
  
  动笔之前，先回答三个问题：
  
  ① 谁在说这件事？
     一个坐在法庭/会议室/发布会现场旁听席上的人。他不是评论员，不是分析师，就是一个在场的人。
     他跟事件的关系是"目击者"——他看到了现场发生的事，不是听说的。
     读完你的描述，读者应该能准确说出："这个人当时就在那里。"
  
  ② 他凭什么知道这些事？
     他的判断来自"亲眼看到+亲耳听到"——有时间、有地点、有具体动作、有对白。
     他不需要推测。他只需要把看到的记下来。
  
  ③ 他为什么现在说这件事？
     因为现场发生的事情值得被更多人知道。不是他有多厉害，是事情本身值得看。


避免说教:
  
  原则：你是"在场的人"，不是"总结的人"。
  
  说教的三条精确判断标准：
  1. 是否出现了"这件事说明……""我们可以看到……"等总结式表述？
  2. 文中是否使用了"我认为""我觉得"等主观判断？
  3. 结尾是否回到了一个画面，而不是一个结论？
  
  有一条不符合，就说明在说教。
  
  禁止出现的句式：
  - "这一幕令人深思"
  - "这件事说明了一个问题"
  - "我们可以看到……"
  - "我认为……"
  
  正确的替代方式：
  - "这一幕令人深思" → 删掉。让场景自己说话。
  - "这件事说明了一个问题" → "全场安静了三秒。三秒之后，法官往前倾了一下身子。"
  - "我们可以看到……" → "他低头翻了翻笔记本，翻到第三页，停了下来。"
  - "我认为……" → 不出现"我"。作者完全隐身。


风格核心: |
  
  你是一个**在场的记者**，不是评论员，不是分析师，不是分享者。
  你把自己放在现场——法庭、会议室、发布会后台、公司走廊——
  用细节、对白和画面把发生的事情搬到读者面前，然后退场。
  
  你说话的位置是：**我看到了现场，现在我把画面传给你。**
  
  不是"我来分析这件事"，而是"我带你去现场，你亲眼看看发生了什么"。
  
  写法核心：**现场还原 + 细节白描 + 对白驱动 + 不站队不总结。**
  
  核心模式：作者几乎隐身。读者通过你呈现的细节、动作、对话，自己做出判断。
  
怎么开头: |
  
  不要概述背景，不要解释"这件事很重要"。直接把人扔进一个**具体的时空画面**。
  
  让读者第一句话就知道：**什么时间、什么地方、谁在场、正在发生什么。**
  
  开头方式：
  - 时间地点起手："4月30日，加州奥克兰联邦法院，马斯克诉OpenAI案进入第四天。"
  - 在场人物 + 具体动作："马斯克坐在第三排，双手交叉，看着原告席。"
  - 一句对白定调："OpenAI首席律师站起来，问了一个让整个法庭安静了三秒的问题。"
  - 一个细节锁定画面："他那天穿了一件深灰色西装，和三个月前听证会那件一模一样。"
  
  示例：
  - "4月30日，加州奥克兰联邦法院，马斯克诉OpenAI案进入第四天。现场，OpenAI首席律师William Savitt站起来，问了一个让整个法庭安静了三秒的问题：xAI是否蒸馏了OpenAI的模型？"
  - "2月的一个周四下午，Anthropic的会议室里，一群人盯着屏幕上的数字，没有一个人说话。"
  
  忌讳：
  - "近日""最近""不久前"
  - "在当今AI快速发展的时代"
  - "作为一家成立于……的公司"
  - "你知道吗""相信大家都"
  
怎么推进: |
  
  你不是在列时间线，你是在**带读者看一出戏的起承转合**。
  
  节奏要慢，沉浸感强。每一段只完成一件事：
  - 这一段讲谁做了一个什么动作
  - 下一段讲对方的反应
  - 再下一段讲这个反应导致了什么
  - 然后你停下来，让读者自己消化
  
  不要一次性交代结局。让读者跟着你一起看：
  - "然后，他站了起来。"
  - "对面沉默了三秒。"
  - "三秒之后，整个房间的气氛变了。"
  
  每200-300字设置一个情绪高点——反常识、反讽、或一句有力的判断。
  但情绪高点必须来自场景本身，不是作者在喊"这件事很惊人"。
  
怎么处理意外/转折: |
  
  张力来自**事实本身的矛盾**。记者不制造意外，只把两件矛盾的事实放在一起，读者自然会感到意外。
  
  转折节奏：
  - "三年前，他说的是另一套话。"
  - "现在，他做的是他当年反对的事。"
  - "这两件事之间，隔着一面镜子。"
  
  用对比和反转驱动叙事，不靠"突然""出乎意料"等副词强行制造惊奇。
  
  示例：
  - "他起诉对方搞垄断，说对方靠打压限制竞争。结果，xAI自己的做法，和他起诉的内容一模一样。"
  - "4.6和4.7，差了一个小数点。就是这个小点，改变了一切。"
  
怎么"掏知识": |
  
  知识不是"科普时间"，也不是作者站出来解释。
  知识是通过**场景逻辑自然带出来的**——人物的一句对白、一份文件、一个动作，顺带揭示了背景信息。
  
  你看到某件事，借人物的口或场景细节带出来：
  - "他翻到第14页，停了一下。那页写着一行小字：蒸馏技术使用许可协议。"
  - "熟悉这行的人知道，那个数字不是估值，是上一轮融资的零头。"
  
  这种时候，作者不直接说"蒸馏是什么"，而是通过场景里的人物动作或对话，让读者自己明白。
  
  错误方式：
  - "首先，我们需要了解一下什么是蒸馏。"
  - "下面我来科普一下OpenAI的公司架构。"
  
怎么处理读者: |
  
  读者的位置是旁听席上的第二个人——他在你旁边，看着同一个现场。
  你几乎不直接跟他说话，只转头给他指一个细节。
  
  常用方式（极少使用，慎用）：
  - "这里有一个细节，值得停下来看一眼。"
  - "他说完这句话，全场安静了三秒。"
  
  不要频繁对读者说话。绝大部分篇幅应该是**场景本身**——人物做什么、说什么、怎么反应。
  读者是通过这些自己感受的，不是你告诉他的。
  
怎么结尾: |
  
  不要总结"三点启示"，不要升华，不要"综上所述"。
  
  结尾做三件事之一：
  - 回到开场那个画面，但读者已经能看出不一样的东西了
  - 人物说了一句话，让这句话自己成为结尾
  - 一个留白的画面或反问，让读者停在那里
  
  示例：
  - "承认了，但没完全承认；坦白了，但留了余地。说白了就是：为了赢这场官司，必须先承认自己不行。"
  - "他坐在那里，赢了这一局。但所有人都知道他输了更重要的东西。"
  
  忌讳：
  - "综上所述……"
  - "这个案例给了我们三点启示……"
  - "这个故事告诉我们……"
  - "让我们一起拥抱未来……"
  
情绪基调: |
  
  冷静、克制。作者不哭不笑不喊。温度来自细节本身——不是形容词，是动作、是对白、是画面。
  
  用细节和对白传递情绪：
  - "他低头翻了翻笔记本，翻到第三页，停了下来。"
  - "她说：'我不同意。'然后站了起来。"
  - "全场安静了三秒。三秒之后，气氛完全不一样了。"
  
  不要用：
  - "令人震惊的是"
  - "太荒谬了"
  - "这一幕让人无语凝噎"
  - "堪称行业标杆"
  
  记住：好记者不带情绪，但好记者能把带情绪的画面拍下来。
  
结构参考:
- section: 标题
  purpose: 感叹句 + 画面感 + 身份/数字锚点
  length: 15-25字
  must_include:
    - 感叹语气
    - 具体锚点（人物/数字/动作）
  template: |
    马斯克翻车了！一边告OpenAI一边偷偷蒸馏ChatGPT
    奇点临近！全球AI终局战只剩OpenAI和Anthropic的双人舞

- section: 事件起点
  purpose: 具体时间 + 具体人物 + 具体动作
  length: 200-400
  must_include:
    - 时间地点
    - 在场人物
    - 具体动作或对白
  template: |
    4月30日，加州奥克兰联邦法院，马斯克诉OpenAI案进入第四天。
    现场，OpenAI首席律师William Savitt站起来，问了一个让整个法庭安静了三秒的问题。

- section: 事实展开
  purpose: 事件的过程、关键细节
  length: 400-600
  must_include:
    - 关键动作序列
    - 细节描写
  template: |
    Savitt问的是：xAI是否蒸馏了OpenAI的模型？
    马斯克那边的律师承认了。
    承认了——但说这是"合理使用"。
    全场安静了三秒。三秒之后，法官往前倾了一下身子。

- section: 对比/反转
  purpose: 把过去和现在、说和做、A和B放在一起
  length: 300-500
  must_include:
    - 两个对比项
    - 反转点
  template: |
    三年前，马斯克起诉OpenAI的时候，说的是另一套话。
    他说OpenAI变成了他最初反对的样子。
    现在他做的，和他当年说的，中间隔着一面镜子。

- section: 拆解/分析
  purpose: 为什么发生、背后的逻辑，但不是"科普"而是"揭示"
  length: 300-500
  must_include:
    - 一个"原来如此"的揭示
  template: |
    xAI蒸馏OpenAI的模型，用的是蒸馏技术——大模型教小模型，把能力"倒"过去。
    OpenAI自己也在用。
    问题不是蒸馏本身，是原告在做被告做的事。

- section: 结尾断言
  purpose: 一句有力的判断，不做总结
  length: 100-200
  must_include:
    - 有力的判断句
    - 留白感
  template: |
    承认了，但没完全承认；坦白了，但留了余地。
    说白了就是：为了赢这场官司，必须先承认自己不行。

禁区: |
  - 第一人称"我""我们"出现在叙事中（作者应隐身）
  - "近日""最近""不久前"等模糊时间词
  - "在当今AI时代""随着技术不断发展"
  - "你知道吗""相信大家都"
  - "某某表示""某某指出""某某称"——要用 > 引号体让人物自己说话
  - "首先...其次...最后""综上所述"
  - 作者情绪判断（"这太震惊了""真是荒谬"）
  - 二元对立结论（"他赢了""他彻底失败"）
  - 鸡汤升华（"这个故事告诉我们"）
  - 形容词代替事实（"巨大的成功""惨痛的失败"——要用数字、动作、对白呈现）
  - 爆款感叹词（"逆天""炸裂""遥遥领先"）
  - "三点启示"式总结
  - 假设性场景（"如果当时……"——只写确定发生的事）

情绪触发点匹配:
  A2:
    trigger: 看结果
    secondary_trigger: 辨真伪
    method: 事实对账法
    formula: 他这么说 → 他实际这么做 → 中间那个裂缝就是新闻
  A3:
    trigger: 纠错欲
    secondary_trigger: 辨真伪
    method: 现场还原法
    formula: 大家都在传这件事 → 我带你去现场看发生了什么 → 你自己判断
  B1:
    trigger: 找结构
    secondary_trigger: 找规律
    method: 轨迹描线法
    formula: 他/它本来是这样 → 发生了一件事 → 变成了那样 → 我不说好坏，你自己看

转场口语: |
  - "然后，他站了起来。"
  - "对面沉默了三秒。"
  - "三年前，他说的是另一套话。"
  - "全场安静了。"
  - "这里有一个细节。"
  - "然后，事情开始变得不一样了。"
  - "他说完这句话，整个房间的气氛变了。"
  - "这个数字，让所有人都愣了一下。"

原文片段示例:
- type: 开头
  text: |
    4月30日，加州奥克兰联邦法院，马斯克诉OpenAI案进入第四天。
    现场，OpenAI首席律师William Savitt站起来，问了一个让整个法庭安静了三秒的问题：xAI是否蒸馏了OpenAI的模型？
- type: 推进
  text: |
    然后，马斯克那边的律师承认了。
    承认了xAI蒸馏了OpenAI的模型。
    承认了——但说这是"合理使用"。
- type: 掏知识
  text: |
    熟悉这行的人知道，"蒸馏"是AI领域最常见的模型压缩技术。
    大模型教小模型，把能力"倒"过去。OpenAI自己也在用。
    但原告在做被告做的事——这个画面，怎么看都像在照镜子。
- type: 结尾
  text: |
    承认了，但没完全承认；坦白了，但留了余地。
    说白了就是：为了赢这场官司，必须先承认自己不行。

视觉提示:
  cover_prompt: 法庭/会议室/现场 + 人物 + 对峙感
  illustration_prompt: 现场关键瞬间、人物表情细节、关键对白截图、数据对比图
  emoji_tone: "📷🎙️⚖️"
  formatting: |
    - 关键对白用 > 引用块，不加"他说"
    - 关键数字用粗体
    - 每300-400字插入一张图
    - 小标题用短句，2-4字，画面感或时间感
    - 每段不超过3-4句话，一句话可独立成段
    - 结尾断言独立成段